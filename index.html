              <div className="flex items-center gap-2">
                <span className="px-2.5 py-0.5 rounded-full text-xs font-bold bg-yellow-400/20 text-yellow-300 border border-yellow-400/30 uppercase tracking-wider">
                  RUM {currentRoomIndex + 1} AV {ROOMS.length}
                </span>
                <span className="text-xs text-slate-400">• Olweus & HateLess</span>
              </div>
              <h1 className="text-2xl font-black text-white mt-0.5">{room.title}</h1>
              <p className="text-xs text-slate-300">{room.subtitle}</p>
            </div>

            {/* Rumsindikator (1-10) */}
            <div className="flex items-center gap-1.5 overflow-x-auto py-1">
              {ROOMS.map((r, idx) => (
                <div 
                  key={r.id} 
                  className={`w-7 h-7 rounded-lg flex items-center justify-center text-xs font-bold transition-all ${
                    idx === currentRoomIndex 
                      ? 'bg-yellow-400 text-slate-950 scale-110 font-black ring-2 ring-yellow-200' 
                      : idx < currentRoomIndex 
                        ? 'bg-emerald-800 text-emerald-200' 
                        : 'bg-slate-800 text-slate-500 border border-slate-700'
                  }`}
                >
                  {idx + 1}
                </div>
              ))}
            </div>
          </header>

          {/* ================= DET DETALJERADE RUMMET (SVG) ================= */}
          <main className="w-full relative aspect-[16/10] max-h-[480px] bg-[#07130e] rounded-3xl overflow-hidden border-4 border-[#14392c] shadow-2xl">
            
            <div key={currentRoomIndex} className="w-full h-full animate-room-change">
              <svg viewBox="0 0 800 500" className="w-full h-full select-none">
                <defs>
                  {/* Trätextur och golvmönster för genuin rumskänsla */}
                  <pattern id="woodWallPattern" width="40" height="40" patternUnits="userSpaceOnUse">
                    <line x1="0" y1="0" x2="0" y2="40" stroke="#000000" strokeWidth="1.5" opacity="0.15" />
                  </pattern>
                  <pattern id="floorPlanks" width="60" height="20" patternUnits="userSpaceOnUse">
                    <line x1="0" y1="0" x2="60" y2="0" stroke="#000000" strokeWidth="2" opacity="0.2" />
                    <line x1="60" y1="0" x2="60" y2="20" stroke="#000000" strokeWidth="2" opacity="0.2" />
                  </pattern>

                  {/* Det autentiska stjärnglittret */}
                  <g id="sparkle-star" className="sparkle-icon">
                    <polygon points="0,-14 4,-4 14,0 4,4 0,14 -4,4 -14,0 -4,-4" fill="#fef08a" />
                    <circle cx="0" cy="0" r="3" fill="#ffffff" />
                  </g>
                </defs>

                {/* 1. MÖBLER OCH RUMSBAKGRUND */}
                {renderRoomIllustration(room.id)}

                {/* 2. DÖRREN / SKÅPET MED DET GULA HÄNGLÅSET (Längst till höger) */}
                <g className="cursor-pointer group" onClick={() => handleOpenModal('door')}>
                  <rect x="640" y="80" width="120" height="280" fill="#1e293b" stroke="#0f172a" strokeWidth="6" rx="4" />
                  <rect x="650" y="90" width="100" height="260" fill={dilemmaSolved ? "#15803d" : "#991b1b"} className="transition-colors group-hover:brightness-110" />
                  <rect x="665" y="115" width="70" height="60" fill="#0f172a" stroke="#ffffff" strokeWidth="2" opacity="0.8" rx="2" />
                  <rect x="660" y="60" width="80" height="22" fill="#dc2626" rx="3" />
                  <text x="700" y="75" fill="#ffffff" fontSize="10" fontWeight="black" textAnchor="middle">{room.doorLabel}</text>
                  
                  {/* Det stora gula hänglåset */}
                  <rect x="685" y="215" width="30" height="25" fill="#facc15" stroke="#ca8a04" strokeWidth="2" rx="4" />
                  <path d="M 692 215 C 692 205, 708 205, 708 215" fill="none" stroke="#cbd5e1" strokeWidth="4" />
                  <circle cx="700" cy="227" r="3" fill="#854d0e" />
                </g>

                {/* 3. STJÄRNGLITTER PÅ DE INTERAKTIVA FÖREMÅLEN */}
                {room.sparkles.map((s, i) => (
                  <g key={i} transform={`translate(${s.x}, ${s.y})`}>
                    <use href="#sparkle-star" />
                  </g>
                ))}

              </svg>
            </div>
          </main>

          {/* ================= BOTTENPANEL (EXAKT SOM I BILDEXEMPLET) ================= */}
          <footer className="w-full mt-3 grid grid-cols-1 md:grid-cols-3 gap-3">
            
            {/* Vänster: Anteckningsboken på beigefärgat papper med handstil */}
            <div className="md:col-span-2 bg-[#fdfaf3] text-slate-800 rounded-2xl p-4 shadow-xl border-l-[12px] border-amber-600 relative overflow-hidden flex flex-col justify-between min-h-[140px]">
              <div>
                <div className="flex items-center justify-between border-b border-amber-200 pb-1 mb-2">
                  <h3 className="font-bold text-xs uppercase tracking-wider text-amber-900">
                    Anteckningsboken – {room.title}
                  </h3>
                  <div className="flex items-center gap-2">
                    {inventory.size > 0 && (
                      <span className="px-2 py-0.5 bg-amber-200 text-amber-900 rounded text-xs font-bold">
                        🎒 Nyckel: {Array.from(inventory).join(", ")}
                      </span>
                    )}
                  </div>
                </div>
                
                <ul className="space-y-1 font-handwriting text-xl text-slate-900 leading-snug">
                  {!discoveredClue && !dilemmaSolved && (
                    <li className="text-slate-400 italic text-lg list-none pt-2">
                      Klicka på sakerna som glittrar i rummet för att påbörja undersökningen...
                    </li>
                  )}
                  {discoveredClue && (
                    <li className="flex items-start gap-2">
                      <span className="text-emerald-700 font-bold">✔</span>
                      <span>{room.clue.notebook}</span>
                    </li>
                  )}
                  {dilemmaSolved && (
                    <li className="flex items-start gap-2 font-bold text-emerald-800">
                      <span className="text-emerald-700">✔</span>
                      <span>{room.dilemma.rewardNote}</span>
                    </li>
                  )}
                </ul>
              </div>

              <div className="text-[11px] text-slate-400 pt-2 border-t border-amber-100 flex justify-between">
                <span>Undersök rummet och fatta rätt beslut för att gå vidare.</span>
                <span>{dilemmaSolved ? "Dilemmat avklarat!" : "Dilemmat olöst"}</span>
              </div>
            </div>

            {/* Höger: Fastnat? Panel */}
            <div className="bg-[#0e261f] rounded-2xl p-4 shadow-xl border border-[#1a4233] flex flex-col justify-between">
              <div>
                <h3 className="text-sm font-bold text-white mb-1 flex items-center gap-1.5">
                  <span className="text-yellow-400">💡</span> Fastnat?
                </h3>
                <p className="text-xs text-slate-300 mb-3">
                  Klicka på sakerna som glittrar i rummet. Behöver ni hjälp med vad nästa steg är?
                </p>
              </div>

              {showHint ? (
                <div className="p-2.5 bg-yellow-400/10 border border-yellow-400/30 rounded-xl text-xs text-yellow-300">
                  <strong>Reflektionstips:</strong> Den som är tyst stöttar mobbaren. Den som sätter gränser visar civilkurage.
                </div>
              ) : (
                <button 
                  onClick={() => setShowHint(true)}
                  className="w-full py-2.5 bg-yellow-400 hover:bg-yellow-300 text-slate-950 text-xs font-bold rounded-xl transition-colors uppercase tracking-wider"
                >
                  Visa en ledtråd
                </button>
              )}
            </div>
          </footer>

          {/* ================= MODALER / POPUPS (EXAKT SOM I BILDERNA) ================= */}
          {activeModal && (
            <div className="fixed inset-0 bg-black/85 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-[#0e261f] border-2 border-[#1a4233] rounded-2xl max-w-lg w-full overflow-hidden shadow-2xl animate-room-change">
                
                {/* Header med titel och Stäng X */}
                <div className="px-5 py-3.5 bg-[#091b16] border-b border-[#1a4233] flex justify-between items-center">
                  <h3 className="font-bold text-white text-sm flex items-center gap-2">
                    {activeModal === 'door' && '🔐 ' + room.doorLabel}
                    {activeModal === 'clue' && '🔍 ' + room.clue.title}
                    {activeModal === 'dilemma' && '⚖️ ' + room.dilemma.title}
                  </h3>
                  <button onClick={handleCloseModal} className="text-slate-300 hover:text-white text-xs px-2.5 py-1 bg-white/10 hover:bg-white/20 rounded-md">
                    Stäng X
                  </button>
                </div>

                {/* Innehåll */}
                <div className="p-6">
                  
                  {/* MODAL 1: LAPPEN MED RÖD KARTNÅL (EXAKT SOM I SCREENSHOT 54) */}
                  {activeModal === 'clue' && (
                    <div>
                      <div className="relative bg-[#fdfbf7] text-slate-800 p-6 rounded-xl shadow-lg border border-amber-200 mb-6">
                        {/* Röd kartnål högst upp i mitten */}
                        <div className="absolute -top-3 left-1/2 -translate-x-1/2 w-6 h-6 bg-red-600 rounded-full border-2 border-red-700 shadow-md"></div>
                        <p className="font-handwriting text-2xl leading-relaxed text-slate-900 pt-2 text-center">
                          "{room.clue.text}"
                        </p>
                      </div>
                      <button 
                        onClick={handleCloseModal} 
                        className="w-full py-3 bg-yellow-400 hover:bg-yellow-300 text-slate-950 font-bold rounded-xl transition-all shadow-md uppercase tracking-wider text-xs"
                      >
                        Skriv in i anteckningsboken
                      </button>
                    </div>
                  )}

                  {/* MODAL 2: MORALISKT DILEMMA */}
                  {activeModal === 'dilemma' && (
                    <div>
                      <div className="bg-[#091813] border border-[#1a4233] p-4 rounded-xl mb-4">
                        <span className="text-[11px] font-bold text-yellow-400 uppercase tracking-wider block mb-1">Situation:</span>
                        <p className="text-slate-200 text-sm leading-relaxed">
                          {room.dilemma.situation}
                        </p>
                      </div>

                      <p className="text-yellow-300 text-xs font-bold uppercase tracking-wider mb-2">
                        {room.dilemma.question}
                      </p>

                      {/* Alternativen A, B, C */}
                      <div className="space-y-2 mb-4">
                        {room.dilemma.options.map((opt) => (
                          <button
                            key={opt.id}
                            disabled={dilemmaSolved}
                            onClick={() => handleSelectOption(opt)}
                            className={`w-full text-left p-3 rounded-xl border text-xs leading-relaxed transition-all flex items-start gap-2.5 ${
                              selectedOptionId === opt.id
                                ? opt.isCorrect
                                  ? 'bg-emerald-950/80 border-emerald-500 text-emerald-200'
                                  : 'bg-rose-950/80 border-rose-500 text-rose-200 animate-shake'
                                : 'bg-[#133328] hover:bg-[#1a4233] border-[#1d4d3d] text-slate-200'
                            }`}
                          >
                            <span className="font-bold text-yellow-400 shrink-0">{opt.id}.</span>
                            <span>{opt.text}</span>
                          </button>
                        ))}
                      </div>

                      {/* Återkoppling på valet */}
                      {optionFeedback && (
                        <div className={`p-3.5 rounded-xl text-xs leading-relaxed mb-4 border ${
                          optionFeedback.isCorrect 
                            ? 'bg-emerald-500/10 border-emerald-500/40 text-emerald-300' 
                            : 'bg-rose-500/10 border-rose-500/40 text-rose-300'
                        }`}>
                          <strong className="block mb-1 font-bold">
                            {optionFeedback.isCorrect ? '✓ Rätt beslut:' : '⚠ Tänk ett varv till:'}
                          </strong>
                          {optionFeedback.feedback}
                        </div>
                      )}

                      {dilemmaSolved && (
                        <button 
                          onClick={handleCloseModal}
                          className="w-full py-3 bg-yellow-400 hover:bg-yellow-300 text-slate-950 font-black text-xs uppercase tracking-wider rounded-xl transition-all shadow-lg"
                        >
                          Fortsätt till dörren ➔
                        </button>
                      )}
                    </div>
                  )}

                  {/* MODAL 3: DÖRREN / EXIT */}
                  {activeModal === 'door' && (
                    <div>
                      {room.keyName && !room.doorCode ? (
                        <div className="text-center">
                          <p className="text-slate-300 text-sm mb-4 leading-relaxed">
                            Den här dörren är låst med ett tungt hänglås och kräver: <br/>
                            <strong className="text-yellow-400 text-base">{room.keyName}</strong>.
                          </p>
                          {inventory.has(room.keyName) ? (
                            <div>
                              <p className="text-emerald-400 font-bold text-sm mb-4">
                                ✓ Du har {room.keyName} i ditt förråd!
                              </p>
                              <button 
                                onClick={handleDoorAction} 
                                className="w-full py-3 bg-yellow-400 hover:bg-yellow-300 text-slate-950 font-black text-xs uppercase tracking-wider rounded-xl transition-all shadow-lg"
                              >
                                Lås upp och gå till nästa rum ➔
                              </button>
                            </div>
                          ) : (
                            <div>
                              <p className="text-rose-400 text-xs font-semibold mb-4">
                                Du saknar nyckeln. Undersök sakerna som glittrar och lös dilemmat först!
                              </p>
                              <button 
                                onClick={handleCloseModal} 
                                className="w-full py-2.5 bg-slate-800 text-slate-300 font-bold rounded-xl text-xs uppercase"
                              >
                                Tillbaka till rummet
                              </button>
                            </div>
                          )}
                        </div>
                      ) : (
                        <div>
                          <p className="text-slate-300 text-sm mb-3">
                            Skriv in koden som avslöjades i anteckningsboken när ni löste dilemmat:
                          </p>
                          <form onSubmit={handleDoorAction} className="space-y-3">
                            <input 
                              type="text" 
                              value={doorInputCode}
                              onChange={(e) => setDoorInputCode(e.target.value)}
                              placeholder="SKRIV DÖRRKODEN HÄR..."
                              autoFocus
                              className="w-full py-3 px-4 bg-[#091813] border-2 border-[#1a4233] focus:border-yellow-400 rounded-xl text-center text-lg font-black text-white tracking-widest uppercase focus:outline-none"
                            />
                            {errorMsg && <p className="text-xs text-rose-400 font-bold text-center animate-shake">{errorMsg}</p>}
                            <button 
                              type="submit" 
                              className="w-full py-3 bg-yellow-400 hover:bg-yellow-300 text-slate-950 font-black text-xs uppercase tracking-wider rounded-xl transition-all shadow-lg"
                            >
                              Lås upp och gå till nästa rum ➔
                            </button>
                          </form>
                        </div>
                      )}
                    </div>
                  )}

                </div>

              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<EscapeRoomApp />);
  </script>
</body>
</html>
