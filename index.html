    /* Mjukt blinkande stjärnglitter */
    @keyframes sparkle-twinkle {
      0%, 100% { opacity: 0.25; transform: scale(0.8) rotate(0deg); }
      50% { opacity: 1; transform: scale(1.3) rotate(45deg); filter: drop-shadow(0 0 8px #fef08a); }
    }
    .sparkle-icon {
      animation: sparkle-twinkle 1.8s ease-in-out infinite;
      transform-origin: center;
      pointer-events: none;
    }

    @keyframes room-fade-in {
      from { opacity: 0; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1); }
    }
    .animate-room-change { animation: room-fade-in 0.35s ease-out forwards; }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }
    .animate-shake { animation: shake 0.4s ease-in-out; }
  </style>

    function EscapeRoomApp() {
      const [currentRoomIndex, setCurrentRoomIndex] = useState(0);
      const [inventory, setInventory] = useState(new Set()); // t.ex. 'Klassrumsnyckeln'
      const [puzzleSolved, setPuzzleSolved] = useState(false);
      const [discoveredClue, setDiscoveredClue] = useState(false);
      const [activeModal, setActiveModal] = useState(null); // 'clue', 'puzzle', 'door'
      const [inputCode, setInputCode] = useState("");
      const [doorInputCode, setDoorInputCode] = useState("");
      const [errorMsg, setErrorMsg] = useState("");
      const [showHint, setShowHint] = useState(false);
      const [gameWon, setGameWon] = useState(false);

      const room = ROOMS[currentRoomIndex];

      const handleOpenModal = (type) => {
        setActiveModal(type);
        setErrorMsg("");
        setShowHint(false);
        if (type === 'clue') {
          setDiscoveredClue(true);
        }
      };

      const handleCloseModal = () => {
        setActiveModal(null);
        setInputCode("");
        setDoorInputCode("");
        setErrorMsg("");
      };

      // När spelaren försöker lösa delpusslet (t.ex. lådan i bänken, facket, datorskärmen)
      const handleSolvePuzzle = (e) => {
        e.preventDefault();
        const cleaned = inputCode.trim().toUpperCase();
        if (room.puzzleObject.answers.includes(cleaned)) {
          setPuzzleSolved(true);
          if (room.doorRequiresKey && room.keyItemName) {
            const newInv = new Set(inventory);
            newInv.add(room.keyItemName);
            setInventory(newInv);
          }
          setErrorMsg("");
        } else {
          setErrorMsg("Fel kod! Titta på ledtråden i rummet en gång till.");
        }
      };

      // När spelaren försöker öppna huvuddörren / gå vidare
      const handleDoorAction = (e) => {
        if (e) e.preventDefault();
        
        if (room.doorRequiresKey) {
          if (inventory.has(room.keyItemName)) {
            advanceRoom();
          } else {
            setErrorMsg(`Dörren är låst! Du behöver hitta '${room.keyItemName}' först.`);
          }
        } else {
          // Kräver kod
          const cleaned = doorInputCode.trim().toUpperCase();
          if (cleaned === room.doorCode) {
            advanceRoom();
          } else {
            setErrorMsg("Fel dörrkod! Läs ledtrådarna noga.");
          }
        }
      };

      const advanceRoom = () => {
        if (currentRoomIndex < ROOMS.length - 1) {
          setCurrentRoomIndex(prev => prev + 1);
          setPuzzleSolved(false);
          setDiscoveredClue(false);
          setActiveModal(null);
          setInputCode("");
          setDoorInputCode("");
          setErrorMsg("");
          setShowHint(false);
        } else {
          setGameWon(true);
        }
      };

      // Ritar den unika 2D-illustrationen för valt rum
      const renderRoomIllustration = (id) => {
        switch (id) {
          case 1:
            return (
              <g>
                <rect x="0" y="0" width="800" height="320" fill="#2c3e50" />
                <rect x="0" y="320" width="800" height="180" fill="#95a5a6" />
                <line x1="0" y1="320" x2="800" y2="320" stroke="#7f8c8d" strokeWidth="6" />
                <rect x="50" y="40" width="140" height="140" fill="#1a252f" stroke="#ecf0f1" strokeWidth="6" rx="4" />
                <line x1="120" y1="40" x2="120" y2="180" stroke="#ecf0f1" strokeWidth="4" />
                <line x1="50" y1="110" x2="190" y2="110" stroke="#ecf0f1" strokeWidth="4" />
                <circle cx="160" cy="70" r="14" fill="#f1c40f" opacity="0.85" />
                {/* Whiteboard */}
                <g className="cursor-pointer group" onClick={() => handleOpenModal('clue')}>
                  <rect x="220" y="50" width="320" height="150" fill="#f8fafc" stroke="#bdc3c7" strokeWidth="8" rx="6" className="group-hover:stroke-yellow-400 transition-colors" />
                  <rect x="235" y="65" width="290" height="120" fill="#ffffff" />
                  <line x1="250" y1="90" x2="420" y2="90" stroke="#2980b9" strokeWidth="4" strokeLinecap="round" />
                  <line x1="250" y1="115" x2="490" y2="115" stroke="#7f8c8d" strokeWidth="3" strokeLinecap="round" />
                  <line x1="250" y1="135" x2="460" y2="135" stroke="#7f8c8d" strokeWidth="3" strokeLinecap="round" />
                </g>
                {/* Skolbänk / Låda */}
                <g className="cursor-pointer group" onClick={() => handleOpenModal('puzzle')}>
                  <rect x="340" y="310" width="220" height="80" fill="#d35400" stroke="#a04000" strokeWidth="4" rx="4" className="group-hover:stroke-yellow-400 transition-colors" />
                  <rect x="360" y="390" width="14" height="80" fill="#7f8c8d" />
                  <rect x="526" y="390" width="14" height="80" fill="#7f8c8d" />
                  <polygon points="380,310 440,310 450,290 390,290" fill="#ecf0f1" stroke="#bdc3c7" strokeWidth="2" />
                  <rect x="300" y="370" width="50" height="70" fill="#2980b9" rx="12" />
                </g>
              </g>
            );

          case 2:
            return (
              <g>
                <rect x="0" y="0" width="800" height="340" fill="#34495e" />
                <rect x="0" y="340" width="800" height="160" fill="#7f8c8d" />
                <line x1="0" y1="340" x2="800" y2="340" stroke="#2c3e50" strokeWidth="6" />
                <g className="cursor-pointer group" onClick={() => handleOpenModal('clue')}>
                  <rect x="80" y="60" width="220" height="150" fill="#d35400" stroke="#a04000" strokeWidth="8" rx="6" className="group-hover:stroke-yellow-400 transition-colors" />

                  <rect x="170" y="95" width="50" height="40" fill="#e74c3c" />
                </g>
                <g className="cursor-pointer group" onClick={() => handleOpenModal('puzzle')}>
                  <rect x="340" y="70" width="260" height="270" fill="#2980b9" stroke="#1f618d" strokeWidth="6" rx="4" className="group-hover:stroke-yellow-400 transition-colors" />

          case 3:

                <rect x="0" y="0" width="800" height="300" fill="#1b2631" />
                <circle cx="680" cy="60" r="22" fill="#f1c40f" opacity="0.9" />
                <rect x="0" y="300" width="800" height="200" fill="#2c3e50" />
                <g className="cursor-pointer group" onClick={() => handleOpenModal('clue')}>
                  <rect x="180" y="80" width="10" height="260" fill="#7f8c8d" />
                  <rect x="130" y="70" width="110" height="75" fill="#ecf0f1" stroke="#e74c3c" strokeWidth="5" rx="4" className="group-hover:stroke-yellow-400 transition-colors" />
                  <line x1="165" y1="130" x2="205" y2="130" stroke="#d35400" strokeWidth="6" />
                </g>
                <g className="cursor-pointer group" onClick={() => handleOpenModal('puzzle')}>
                  <rect x="400" y="310" width="200" height="40" fill="#795548" stroke="#4e342e" strokeWidth="4" rx="3" className="group-hover:stroke-yellow-400 transition-colors" />
                  <rect x="420" y="350" width="12" height="60" fill="#2c3e50" />
                  <rect x="568" y="350" width="12" height="60" fill="#2c3e50" />
                  <circle cx="480" cy="330" r="14" fill="#e74c3c" />
                </g>
              </g>
            );

          case 4: // BIBLIOTEKET MED FACKET
            return (
              <g>
                <rect x="0" y="0" width="800" height="320" fill="#1e272e" />
                <rect x="0" y="320" width="800" height="180" fill="#4b382a" />
                <line x1="0" y1="320" x2="800" y2="320" stroke="#3d2c1f" strokeWidth="6" />
                {/* Bokhyllan med Facket */}
                <g className="cursor-pointer group" onClick={() => handleOpenModal('clue')}>
                  <rect x="120" y="50" width="280" height="270" fill="#5c4033" stroke="#3d2c1f" strokeWidth="8" rx="6" className="group-hover:stroke-yellow-400 transition-colors" />
                  <rect x="135" y="110" width="250" height="10" fill="#3d2c1f" />
                  <rect x="145" y="65" width="16" height="45" fill="#e74c3c" />
                  <rect x="165" y="60" width="18" height="50" fill="#2980b9" />
                  <rect x="187" y="70" width="14" height="40" fill="#f1c40f" />
                  {/* Facket i hyllan med mässingsknopp */}
                  <rect x="250" y="140" width="80" height="60" fill="#3d2c1f" stroke="#795548" strokeWidth="3" rx="3" />
                  <circle cx="290" cy="170" r="5" fill="#f1c40f" />
                </g>
                {/* Läsbord med boken */}
                <g className="cursor-pointer group" onClick={() => handleOpenModal('puzzle')}>
                  <rect x="440" y="250" width="160" height="70" fill="#795548" rx="4" className="group-hover:stroke-yellow-400 transition-colors" />
                  <polygon points="480,250 540,250 530,225 490,225" fill="#ecf0f1" stroke="#bdc3c7" strokeWidth="2" />
                </g>
              </g>
            );

          case 5:
            return (
              <g>
                <rect x="0" y="0" width="800" height="330" fill="#0f172a" />
                <rect x="0" y="330" width="800" height="170" fill="#1e293b" />
                <line x1="0" y1="330" x2="800" y2="330" stroke="#334155" strokeWidth="6" />
                <g className="cursor-pointer group" onClick={() => handleOpenModal('puzzle')}>
                  <rect x="150" y="220" width="240" height="110" fill="#334155" rx="4" className="group-hover:stroke-yellow-400 transition-colors" />
                  <rect x="170" y="120" width="90" height="70" fill="#1e293b" stroke="#64748b" strokeWidth="4" rx="3" />
                  <rect x="176" y="126" width="78" height="58" fill={puzzleSolved ? "#22c55e" : "#38bdf8"} opacity="0.9" />
                  <line x1="215" y1="190" x2="215" y2="220" stroke="#64748b" strokeWidth="6" />
                </g>
                <g className="cursor-pointer group" onClick={() => handleOpenModal('clue')}>
                  <rect x="450" y="70" width="140" height="260" fill="#020617" stroke="#475569" strokeWidth="6" rx="4" className="group-hover:stroke-yellow-400 transition-colors" />
                  <rect x="470" y="140" width="30" height="30" fill="#facc15" rx="2" />
                </g>
              </g>
            );

          case 6:
            return (
              <g>
                <rect x="0" y="0" width="800" height="330" fill="#f8fafc" />
                <rect x="0" y="330" width="800" height="170" fill="#e2e8f0" />
                <g className="cursor-pointer group" onClick={() => handleOpenModal('puzzle')}>
                  <rect x="120" y="70" width="180" height="260" fill="#e11d48" stroke="#be123c" strokeWidth="6" rx="6" className="group-hover:stroke-yellow-400 transition-colors" />
                  <rect x="140" y="90" width="140" height="110" fill="#0f172a" rx="4" />
                </g>
                <g className="cursor-pointer group" onClick={() => handleOpenModal('clue')}>
                  <rect x="380" y="270" width="220" height="60" fill="#ffffff" stroke="#94a3b8" strokeWidth="4" rx="6" className="group-hover:stroke-yellow-400 transition-colors" />
                  <rect x="440" y="250" width="30" height="18" fill="#0f172a" rx="3" />
                </g>
              </g>
            );

          case 7:
            return (
              <g>
                <rect x="0" y="0" width="800" height="300" fill="#0284c7" />
                <rect x="0" y="300" width="800" height="200" fill="#f59e0b" />
                <g className="cursor-pointer group" onClick={() => handleOpenModal('clue')}>
                  <rect x="420" y="50" width="180" height="250" fill="none" stroke="#d97706" strokeWidth="8" rx="4" className="group-hover:stroke-yellow-400 transition-colors" />
                </g>
                <g className="cursor-pointer group" onClick={() => handleOpenModal('puzzle')}>
                  <rect x="180" y="330" width="220" height="35" fill="#b45309" stroke="#78350f" strokeWidth="4" rx="3" className="group-hover:stroke-yellow-400 transition-colors" />
                  <rect x="250" y="310" width="50" height="20" fill="#1e293b" rx="4" />
                </g>
              </g>
            );

          case 8:
            return (
              <g>
                <rect x="0" y="0" width="800" height="320" fill="#fef3c7" />
                <rect x="0" y="320" width="800" height="180" fill="#78350f" />
                <g className="cursor-pointer group" onClick={() => handleOpenModal('clue')}>
                  <rect x="150" y="190" width="240" height="130" fill="#047857" stroke="#065f46" strokeWidth="6" rx="16" className="group-hover:stroke-yellow-400 transition-colors" />
                </g>
                <g className="cursor-pointer group" onClick={() => handleOpenModal('puzzle')}>
                  <polygon points="480,240 540,240 530,310 490,310" fill="#d97706" className="group-hover:stroke-yellow-400 transition-colors" />
                  <circle cx="510" cy="180" r="30" fill="#15803d" />
                  <rect x="495" y="270" width="30" height="20" fill="#475569" rx="2" />
                </g>
              </g>
            );

          case 9:
            return (
              <g>
                <rect x="0" y="0" width="800" height="310" fill="#1e1b4b" />
                <rect x="0" y="310" width="800" height="190" fill="#312e81" />
                <g className="cursor-pointer group" onClick={() => handleOpenModal('clue')}>
                  <rect x="120" y="50" width="160" height="180" fill="#fbbf24" stroke="#d97706" strokeWidth="6" rx="4" className="group-hover:stroke-yellow-400 transition-colors" />
                </g>
                <g className="cursor-pointer group" onClick={() => handleOpenModal('puzzle')}>
                  <rect x="330" y="260" width="280" height="60" fill="#15803d" stroke="#ffffff" strokeWidth="4" rx="4" className="group-hover:stroke-yellow-400 transition-colors" />
                  <circle cx="430" cy="285" r="12" fill="#dc2626" />
                </g>
              </g>
            );

          case 10:
            return (
              <g>
                <rect x="0" y="0" width="800" height="320" fill="#312e81" />
                <rect x="0" y="320" width="800" height="180" fill="#451a03" />
                <g className="cursor-pointer group" onClick={() => handleOpenModal('clue')}>
                  <rect x="180" y="50" width="160" height="120" fill="#fef08a" stroke="#ca8a04" strokeWidth="8" rx="4" className="group-hover:stroke-yellow-400 transition-colors" />
                </g>
                <g className="cursor-pointer group" onClick={() => handleOpenModal('puzzle')}>
                  <rect x="380" y="240" width="220" height="90" fill="#78350f" stroke="#451a03" strokeWidth="6" rx="4" className="group-hover:stroke-yellow-400 transition-colors" />
                  <rect x="420" y="200" width="40" height="15" fill="#15803d" rx="3" />
                </g>
              </g>
            );

          default:
            return null;
        }
      };

      if (gameWon) {
        return (
          <div className="min-h-screen bg-[#070e13] flex items-center justify-center p-4">
            <div className="bg-[#111c24] border-2 border-yellow-400 rounded-3xl p-10 max-w-xl text-center shadow-2xl">
              <div className="w-24 h-24 mx-auto mb-6 bg-yellow-400/20 rounded-full flex items-center justify-center border-2 border-yellow-400">
                <span className="text-5xl">🏆</span>
              </div>
              <h1 className="text-3xl font-extrabold text-yellow-400 mb-3 uppercase tracking-wider">Alla rum lösta!</h1>
              <p className="text-slate-300 text-lg mb-8 leading-relaxed">
                Ni tog er igenom alla 10 skolmiljöer, löste flerstegsgåtorna om normer, nätetik och civilkurage och låste upp nyckeln till ett tryggt <strong>SKOLKLIMAT</strong>!
              </p>
              <button 
                onClick={() => { setCurrentRoomIndex(0); setInventory(new Set()); setPuzzleSolved(false); setDiscoveredClue(false); setGameWon(false); }}
                className="px-8 py-3.5 bg-yellow-400 hover:bg-yellow-300 text-slate-950 font-black rounded-xl transition-all shadow-lg hover:scale-105 uppercase tracking-wider"
              >
                Spela igen från början
              </button>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen flex flex-col items-center justify-between p-4 max-w-5xl mx-auto">
          
          {/* HEADER */}
          <header className="w-full mb-3 flex flex-col md:flex-row md:items-center md:justify-between gap-3 bg-[#111c24] p-4 rounded-2xl border border-slate-800">
            <div>
              <div className="flex items-center gap-2">
                <span className="px-2.5 py-0.5 rounded-full text-xs font-bold bg-yellow-400/20 text-yellow-300 border border-yellow-400/30 uppercase tracking-wider">
                  RUM {currentRoomIndex + 1} AV {ROOMS.length}
                </span>
                <span className="text-xs text-slate-400">• Flerstegs-Escape</span>
              </div>
              <h1 className="text-2xl font-black text-white mt-0.5">{room.title}</h1>
              <p className="text-xs text-slate-300">{room.subtitle}</p>
            </div>

            {/* Rumsindikator */}
            <div className="flex items-center gap-1.5 overflow-x-auto py-1">
              {ROOMS.map((r, idx) => (
                <div 
                  key={r.id} 
                  className={`w-7 h-7 rounded-lg flex items-center justify-center text-xs font-bold transition-all ${
                    idx === currentRoomIndex 
                      ? 'bg-yellow-400 text-slate-950 scale-110 font-black ring-2 ring-yellow-200' 
                      : idx < currentRoomIndex 
                        ? 'bg-emerald-900/60 text-emerald-300 border border-emerald-700/50' 
                        : 'bg-slate-800 text-slate-500 border border-slate-700'
                  }`}
                >
                  {idx + 1}
                </div>
              ))}
            </div>
          </header>

          {/* ================= DET INTERAKTIVA RUMMET (SVG) ================= */}
          <main className="w-full relative aspect-[16/10] max-h-[500px] bg-[#070e13] rounded-3xl overflow-hidden border-4 border-slate-800 shadow-2xl">
            
            <div key={currentRoomIndex} className="w-full h-full animate-room-change">
              <svg viewBox="0 0 800 500" className="w-full h-full select-none">
                <defs>
                  {/* Diskret stjärnglitter precis som i bildexemplet */}
                  <g id="sparkle-star" className="sparkle-icon">
                    <polygon points="0,-14 4,-4 14,0 4,4 0,14 -4,4 -14,0 -4,-4" fill="#fef08a" />
                    <circle cx="0" cy="0" r="3" fill="#ffffff" />
                  </g>
                </defs>

                {/* 1. MÖBLERING OCH VÄGGAR */}
                {renderRoomIllustration(room.id)}

                {/* 2. DÖRREN / EXIT-LÅSET (Längst till höger) */}
                <g className="cursor-pointer group" onClick={() => handleOpenModal('door')}>
                  <rect x="640" y="80" width="120" height="280" fill="#1e293b" stroke="#0f172a" strokeWidth="6" rx="4" />
                  <rect x="650" y="90" width="100" height="260" fill={puzzleSolved ? "#15803d" : "#b91c1c"} className="transition-colors" />
                  <rect x="665" y="115" width="70" height="60" fill="#0f172a" stroke="#ffffff" strokeWidth="2" opacity="0.8" rx="2" />
                  <rect x="660" y="60" width="80" height="22" fill="#dc2626" rx="3" />
                  <text x="700" y="75" fill="#ffffff" fontSize="10" fontWeight="black" textAnchor="middle">{room.doorLabel}</text>
                  
                  {/* Hänglås / Låsikon */}
                  <rect x="685" y="215" width="30" height="25" fill="#facc15" stroke="#ca8a04" strokeWidth="2" rx="4" />
                  <path d="M 692 215 C 692 205, 708 205, 708 215" fill="none" stroke="#cbd5e1" strokeWidth="4" />
                  <circle cx="700" cy="227" r="3" fill="#854d0e" />
                </g>

                {/* 3. GLITTER PÅ DE INTERAKTIVA FÖREMÅLEN */}
                <g transform={`translate(${room.clueObject.pos.x}, ${room.clueObject.pos.y})`}>
                  <use href="#sparkle-star" />
                </g>

                <g transform={`translate(${room.puzzleObject.pos.x}, ${room.puzzleObject.pos.y})`}>
                  <use href="#sparkle-star" />
                </g>

                <g transform="translate(700, 225)">
                  <use href="#sparkle-star" />
                </g>

              </svg>
            </div>
          </main>

          {/* ================= BOTTENPANEL (ANTECKNINGSBOK & HJÄLP) ================= */}
          <footer className="w-full mt-3 grid grid-cols-1 md:grid-cols-3 gap-3">
            
            {/* Anteckningsboken */}
            <div className="md:col-span-2 bg-[#fdfaf3] text-slate-800 rounded-2xl p-4 shadow-xl border-l-[12px] border-amber-600 relative overflow-hidden flex flex-col justify-between min-h-[140px]">
              <div>
                <div className="flex items-center justify-between border-b border-amber-200 pb-1 mb-2">
                  <h3 className="font-bold text-xs uppercase tracking-wider text-amber-900">
                    Anteckningsboken – {room.title}
                  </h3>
                  <div className="flex items-center gap-2">
                    {inventory.size > 0 && (
                      <span className="px-2 py-0.5 bg-amber-200 text-amber-900 rounded text-xs font-bold">
                        🎒 Föremål: {Array.from(inventory).join(", ")}
                      </span>
                    )}
                  </div>
                </div>
                
                <ul className="space-y-1 font-handwriting text-xl text-slate-900 leading-snug">
                  {!discoveredClue && !puzzleSolved && (
                    <li className="text-slate-400 italic text-lg list-none pt-2">
                      Klicka på sakerna som glittrar i rummet för att påbörja gåtan...
                    </li>
                  )}
                  {discoveredClue && (
                    <li className="flex items-start gap-2">
                      <span className="text-emerald-700 font-bold">✔</span>
                      <span>{room.clueObject.notebook}</span>
                    </li>
                  )}
                  {puzzleSolved && (
                    <li className="flex items-start gap-2 font-bold text-emerald-800">
                      <span className="text-emerald-700">✔</span>
                      <span>{room.puzzleObject.rewardNote}</span>
                    </li>
                  )}
                </ul>
              </div>

              <div className="text-[11px] text-slate-400 pt-2 border-t border-amber-100 flex justify-between">
                <span>Lös delpusslet för att öppna dörren till nästa rum.</span>
                <span>{puzzleSolved ? "Delpussel klart!" : "Delpussel kvar"}</span>
              </div>
            </div>

            {/* Fastnat? Hjälp-panel */}
            <div className="bg-[#111c24] rounded-2xl p-4 shadow-xl border border-slate-800 flex flex-col justify-between">
              <div>
                <h3 className="text-sm font-bold text-white mb-1 flex items-center gap-1.5">
                  <span className="text-yellow-400">💡</span> Fastnat?
                </h3>
                <p className="text-xs text-slate-300 mb-3">
                  Undersök föremålen som glittrar. Behöver ni hjälp med nästa steg i gåtan?
                </p>
              </div>

              {showHint ? (
                <div className="p-2.5 bg-yellow-400/10 border border-yellow-400/30 rounded-xl text-xs text-yellow-300">
                  <strong>Ledtråd:</strong> {room.puzzleObject.hint}
                </div>
              ) : (
                <button 
                  onClick={() => setShowHint(true)}
                  className="w-full py-2.5 bg-slate-800 hover:bg-slate-700 text-yellow-300 text-xs font-bold rounded-xl border border-yellow-400/30 transition-colors"
                >
                  Visa en ledtråd
                </button>
              )}
            </div>
          </footer>

          {/* ================= MODAL / POPUP ================= */}
          {activeModal && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-[#111c24] border-2 border-slate-700 rounded-2xl max-w-md w-full overflow-hidden shadow-2xl animate-room-change">
                
                {/* Modal Header */}
                <div className="px-5 py-3.5 bg-slate-800/80 border-b border-slate-700 flex justify-between items-center">
                  <h3 className="font-bold text-white text-sm flex items-center gap-2">
                    {activeModal === 'door' && '🔐 ' + room.doorLabel}
                    {activeModal === 'clue' && '🔍 ' + room.clueObject.name}
                    {activeModal === 'puzzle' && '⚙️ ' + room.puzzleObject.name}
                  </h3>
                  <button onClick={handleCloseModal} className="text-slate-400 hover:text-white text-xs px-2.5 py-1 bg-slate-700 rounded-md">
                    Stäng ✕
                  </button>
                </div>

                {/* Modal Innehåll */}
                <div className="p-6">
                  
                  {/* MODAL 1: LEDTRÅDS-OBJEKTET */}
                  {activeModal === 'clue' && (
                    <div>
                      <div className="bg-[#fdfaf3] text-slate-800 p-5 rounded-xl mb-5 font-handwriting text-2xl leading-snug shadow-inner border border-amber-200">
                        "{room.clueObject.text}"
                      </div>
                      <button 
                        onClick={handleCloseModal} 
                        className="w-full py-3 bg-yellow-400 hover:bg-yellow-300 text-slate-950 font-bold rounded-xl transition-all shadow-md uppercase tracking-wider text-xs"
                      >
                        Anteckna i boken
                      </button>
                    </div>
                  )}

                  {/* MODAL 2: DELPUSSEL-OBJEKTET (Lådan/Facket/Datorn) */}
                  {activeModal === 'puzzle' && (
                    <div>
                      {!puzzleSolved ? (
                        <div>
                          <p className="text-slate-300 text-sm mb-3">
                            {room.puzzleObject.lockedText}
                          </p>
                          <p className="text-yellow-400 text-sm font-semibold mb-4">
                            {room.puzzleObject.question}
                          </p>
                          <form onSubmit={handleSolvePuzzle} className="space-y-3">
                            <input 
                              type="text" 
                              value={inputCode}
                              onChange={(e) => setInputCode(e.target.value)}
                              placeholder="SKRIV KODEN HÄR..."
                              autoFocus
                              className="w-full py-3 px-4 bg-slate-950 border-2 border-slate-700 focus:border-yellow-400 rounded-xl text-center text-lg font-black text-white tracking-widest uppercase focus:outline-none"
                            />
                            {errorMsg && <p className="text-xs text-rose-400 font-bold text-center animate-shake">{errorMsg}</p>}
                            <button 
                              type="submit" 
                              className="w-full py-3 bg-yellow-400 hover:bg-yellow-300 text-slate-950 font-black text-xs uppercase tracking-wider rounded-xl transition-all shadow-lg"
                            >
                              Försök öppna
                            </button>
                          </form>
                        </div>
                      ) : (
                        <div className="text-center">
                          <div className="w-12 h-12 bg-emerald-500/20 text-emerald-400 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl border border-emerald-500/40">
                            ✓
                          </div>
                          <p className="text-emerald-300 font-bold mb-3">{room.puzzleObject.unlockedText}</p>
                          <button 
                            onClick={handleCloseModal} 
                            className="w-full py-3 bg-slate-800 hover:bg-slate-700 text-white font-bold rounded-xl text-xs uppercase tracking-wider"
                          >
                            Fortsätt till dörren
                          </button>
                        </div>
                      )}
                    </div>
                  )}

                  {/* MODAL 3: HUVUDDÖRREN / EXIT */}
                  {activeModal === 'door' && (
                    <div>
                      {room.doorRequiresKey ? (
                        <div className="text-center">
                          <p className="text-slate-300 text-sm mb-4">
                            Den här dörren är låst med ett kraftigt fysiskt lås och kräver: <br/>
                            <strong className="text-yellow-400 text-base">{room.keyItemName}</strong>.
                          </p>
                          {inventory.has(room.keyItemName) ? (
                            <div>
                              <p className="text-emerald-400 font-bold text-sm mb-4">
                                Du har {room.keyItemName} i ditt förråd!
                              </p>
                              <button 
                                onClick={handleDoorAction} 
                                className="w-full py-3 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black text-xs uppercase tracking-wider rounded-xl transition-all shadow-lg"
                              >
                                Lås upp och gå till nästa rum ➔
                              </button>
                            </div>
                          ) : (
                            <div>
                              <p className="text-rose-400 text-xs font-semibold mb-4">
                                Du saknar nyckeln. Undersök de andra föremålen i rummet först!
                              </p>
                              <button 
                                onClick={handleCloseModal} 
                                className="w-full py-2.5 bg-slate-800 text-slate-300 font-bold rounded-xl text-xs uppercase"
                              >
                                Tillbaka till rummet
                              </button>
                            </div>
                          )}
                        </div>
                      ) : (
                        <div>
                          <p className="text-slate-300 text-sm mb-3">
                            {room.doorQuestion}
                          </p>
                          <form onSubmit={handleDoorAction} className="space-y-3">
                            <input 
                              type="text" 
                              value={doorInputCode}
                              onChange={(e) => setDoorInputCode(e.target.value)}
                              placeholder="SKRIV DÖRRKODEN HÄR..."
                              autoFocus
                              className="w-full py-3 px-4 bg-slate-950 border-2 border-slate-700 focus:border-yellow-400 rounded-xl text-center text-lg font-black text-white tracking-widest uppercase focus:outline-none"
                            />
                            {errorMsg && <p className="text-xs text-rose-400 font-bold text-center animate-shake">{errorMsg}</p>}
                            <button 
                              type="submit" 
                              className="w-full py-3 bg-yellow-400 hover:bg-yellow-300 text-slate-950 font-black text-xs uppercase tracking-wider rounded-xl transition-all shadow-lg"
                            >
                              Lås upp och gå till nästa rum ➔
                            </button>
                          </form>
                        </div>
                      )}
                    </div>
                  )}

                </div>

              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<EscapeRoomApp />);
  </script>
</body>
</html>
