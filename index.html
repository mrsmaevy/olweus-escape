    function EscapeRoomApp() {
      const [currentRoomIndex, setCurrentRoomIndex] = useState(0);
      const [inventory, setInventory] = useState(new Set());
      const [puzzleSolved, setPuzzleSolved] = useState(false);
      const [discoveredClue, setDiscoveredClue] = useState(false);
      const [activeModal, setActiveModal] = useState(null); // 'clue', 'puzzle', 'door'
      
      // Tillstånd för pussel i aktivt rum
      const [reorderList, setReorderList] = useState([]);
      const [categorizedItems, setCategorizedItems] = useState({});
      const [selectedOptions, setSelectedOptions] = useState(new Set());
      const [wheelValues, setWheelValues] = useState({});
      const [doorInputCode, setDoorInputCode] = useState("");
      
      const [errorMsg, setErrorMsg] = useState("");
      const [showHint, setShowHint] = useState(false);
      const [gameWon, setGameWon] = useState(false);

      const room = ROOMS[currentRoomIndex];

      // Initiera tillstånd när ett nytt rum laddas
      const initRoomState = (roomIdx) => {
        const r = ROOMS[roomIdx];
        setPuzzleSolved(false);
        setDiscoveredClue(false);
        setActiveModal(null);
        setErrorMsg("");
        setShowHint(false);
        setDoorInputCode("");

        if (r.puzzle.type === "reorder") {
          setReorderList([...r.puzzle.initialItems]);
        } else if (r.puzzle.type === "categorize") {
          const initialCats = {};
          r.puzzle.items.forEach(item => {
            initialCats[item.id] = r.puzzle.categories[0]; // standardkategori
          });
          setCategorizedItems(initialCats);
        } else if (r.puzzle.type === "multiSelect") {
          setSelectedOptions(new Set());
        } else if (r.puzzle.type === "combinationWheels") {
          const initWheels = {};
          r.puzzle.wheels.forEach(w => {
            initWheels[w.id] = w.options[0];
          });
          setWheelValues(initWheels);
        }
      };

      // Körs vid start
      React.useEffect(() => {
        initRoomState(0);
      }, []);

      const handleOpenModal = (type) => {
        setActiveModal(type);
        setErrorMsg("");
        setShowHint(false);
        if (type === 'clue') {
          setDiscoveredClue(true);
        }
      };

      const handleCloseModal = () => {
        setActiveModal(null);
        setErrorMsg("");
      };

      // --- PUSSEL-KONTROLLER ---

      // 1. Reorder (Flytta upp/ner i listan)
      const handleMoveItem = (index, direction) => {
        const targetIdx = index + direction;
        if (targetIdx < 0 || targetIdx >= reorderList.length) return;
        const newList = [...reorderList];
        const temp = newList[index];
        newList[index] = newList[targetIdx];
        newList[targetIdx] = temp;
        setReorderList(newList);
      };

      const checkReorderSolution = () => {
        const currentOrder = reorderList.map(item => item.id);
        const isMatch = currentOrder.every((val, idx) => val === room.puzzle.correctOrder[idx]);
        if (isMatch) {
          completePuzzle();
        } else {
          setErrorMsg("Ordningsföljden är inte helt rätt än. Tänk på vad som måste ske först!");
        }
      };

      // 2. Categorize (Växla kategori)
      const handleCycleCategory = (itemId) => {
        const currentCat = categorizedItems[itemId];

              </div>

              {showHint ? (
                <div className="p-2.5 bg-yellow-400/10 border border-yellow-400/30 rounded-xl text-xs text-yellow-300">
                  <strong>Tips:</strong> Läs den första anteckningen noga – där finns logiken för hur pusslet ska ordnas eller sorteras.
                </div>
              ) : (
                <button 
                  onClick={() => setShowHint(true)}
                  className="w-full py-2.5 bg-yellow-400 hover:bg-yellow-300 text-slate-950 text-xs font-bold rounded-xl transition-colors uppercase tracking-wider"
                >
                  Visa en ledtråd
                </button>
              )}
            </div>
          </footer>

          {/* ================= MODALER / INTERAKTIVA PUSSEL ================= */}
          {activeModal && (
            <div className="fixed inset-0 bg-black/85 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-[#0e261f] border-2 border-[#1a4233] rounded-2xl max-w-lg w-full overflow-hidden shadow-2xl animate-room-change">
                
                {/* Header med Stäng X */}
                <div className="px-5 py-3.5 bg-[#091b16] border-b border-[#1a4233] flex justify-between items-center">
                  <h3 className="font-bold text-white text-sm flex items-center gap-2">
                    {activeModal === 'door' && '🔐 ' + room.doorLabel}
                    {activeModal === 'clue' && '🔍 ' + room.clue.title}
                    {activeModal === 'puzzle' && '⚙️ ' + room.puzzle.title}
                  </h3>
                  <button onClick={handleCloseModal} className="text-slate-300 hover:text-white text-xs px-2.5 py-1 bg-white/10 hover:bg-white/20 rounded-md">
                    Stäng X
                  </button>
                </div>

                {/* Innehåll */}
                <div className="p-6 max-h-[80vh] overflow-y-auto">
                  
                  {/* MODAL 1: LAPPEN / LEDTRÅDEN */}
                  {activeModal === 'clue' && (
                    <div>
                      <div className="relative bg-[#fdfbf7] text-slate-800 p-6 rounded-xl shadow-lg border border-amber-200 mb-6">
                        <div className="absolute -top-3 left-1/2 -translate-x-1/2 w-6 h-6 bg-red-600 rounded-full border-2 border-red-700 shadow-md"></div>
                        <p className="font-handwriting text-2xl leading-relaxed text-slate-900 pt-2 text-center">
                          "{room.clue.text}"
                        </p>
                      </div>
                      <button 
                        onClick={handleCloseModal} 
                        className="w-full py-3 bg-yellow-400 hover:bg-yellow-300 text-slate-950 font-bold rounded-xl transition-all shadow-md uppercase tracking-wider text-xs"
                      >
                        Skriv in i anteckningsboken
                      </button>
                    </div>
                  )}

                  {/* MODAL 2: DET PRAKTISKA PUSSLET */}
                  {activeModal === 'puzzle' && (
                    <div>
                      {!puzzleSolved ? (
                        <div>
                          <p className="text-xs text-yellow-300 font-bold uppercase tracking-wider mb-3">
                            {room.puzzle.instruction}
                          </p>

                          {/* TYP 1: REORDER (FLYTTA UPP / NER) */}
                          {room.puzzle.type === "reorder" && (
                            <div className="space-y-2 mb-4">
                              {reorderList.map((item, idx) => (
                                <div key={item.id} className="bg-[#133328] border border-[#1d4d3d] p-3 rounded-xl flex items-center justify-between gap-3 text-xs">
                                  <span className="font-medium text-slate-200">{item.text}</span>
                                  <div className="flex gap-1 shrink-0">
                                    <button 
                                      disabled={idx === 0}
                                      onClick={() => handleMoveItem(idx, -1)}
                                      className="px-2 py-1 bg-[#1a4233] hover:bg-yellow-400 hover:text-slate-950 disabled:opacity-30 rounded font-bold transition-colors"
                                    >
                                      ▲
                                    </button>
                                    <button 
                                      disabled={idx === reorderList.length - 1}
                                      onClick={() => handleMoveItem(idx, 1)}
                                      className="px-2 py-1 bg-[#1a4233] hover:bg-yellow-400 hover:text-slate-950 disabled:opacity-30 rounded font-bold transition-colors"
                                    >
                                      ▼
                                    </button>
                                  </div>
                                </div>
                              ))}
                              <button 
                                onClick={checkReorderSolution}
                                className="w-full py-3 bg-yellow-400 hover:bg-yellow-300 text-slate-950 font-black text-xs uppercase tracking-wider rounded-xl transition-all shadow-lg mt-3"
                              >
                                Kontrollera ordningsföljden
                              </button>
                            </div>
                          )}

                          {/* TYP 2: CATEGORIZE (VÄXLA KATEGORIER) */}
                          {room.puzzle.type === "categorize" && (
                            <div className="space-y-2.5 mb-4">
                              {room.puzzle.items.map(item => (
                                <div key={item.id} className="bg-[#133328] border border-[#1d4d3d] p-3 rounded-xl text-xs flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                                  <span className="text-slate-200">{item.text}</span>
                                  <button
                                    onClick={() => handleCycleCategory(item.id)}
                                    className="px-3 py-1.5 bg-[#1a4233] hover:bg-yellow-400 hover:text-slate-950 text-yellow-300 font-bold rounded-lg border border-[#27634d] transition-colors self-end sm:self-auto shrink-0"
                                  >
                                    {categorizedItems[item.id]} ⇄
                                  </button>
                                </div>
                              ))}
                              <button 
                                onClick={checkCategorizeSolution}
                                className="w-full py-3 bg-yellow-400 hover:bg-yellow-300 text-slate-950 font-black text-xs uppercase tracking-wider rounded-xl transition-all shadow-lg mt-3"
                              >
                                Kontrollera sorteringen
                              </button>
                            </div>
                          )}

                          {/* TYP 3: MULTISELECT */}
                          {room.puzzle.type === "multiSelect" && (
                            <div className="space-y-2 mb-4">
                              {room.puzzle.options.map(opt => {
                                const isSelected = selectedOptions.has(opt.id);
                                return (
                                  <button
                                    key={opt.id}
                                    onClick={() => handleToggleSelect(opt.id)}
                                    className={`w-full text-left p-3 rounded-xl border text-xs leading-relaxed transition-all flex items-start gap-2.5 ${
                                      isSelected
                                        ? 'bg-yellow-400/20 border-yellow-400 text-yellow-200'
                                        : 'bg-[#133328] hover:bg-[#1a4233] border-[#1d4d3d] text-slate-200'
                                    }`}
                                  >
                                    <span className={`w-4 h-4 rounded border flex items-center justify-center shrink-0 mt-0.5 ${isSelected ? 'bg-yellow-400 text-slate-950 border-yellow-400 font-bold' : 'border-slate-500'}`}>
                                      {isSelected ? '✓' : ''}
                                    </span>
                                    <span>{opt.text}</span>
                                  </button>
                                );
                              })}
                              <button 
                                onClick={checkMultiSelectSolution}
                                className="w-full py-3 bg-yellow-400 hover:bg-yellow-300 text-slate-950 font-black text-xs uppercase tracking-wider rounded-xl transition-all shadow-lg mt-3"
                              >
                                Kontrollera valda alternativ ({selectedOptions.size} av {room.puzzle.requiredCount})
                              </button>
                            </div>
                          )}

                          {/* TYP 4: COMBINATION WHEELS */}
                          {room.puzzle.type === "combinationWheels" && (
                            <div className="mb-4">
                              <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 mb-4">
                                {room.puzzle.wheels.map(w => (
                                  <div key={w.id} className="bg-[#133328] border border-[#1d4d3d] p-3 rounded-xl text-center">
                                    <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider block mb-1">{w.label}</span>
                                    <div className="py-2 px-1 bg-[#091b16] rounded-lg text-yellow-300 font-black text-sm mb-2 border border-slate-700">
                                      {wheelValues[w.id]}
                                    </div>
                                    <button
                                      onClick={() => handleCycleWheel(w.id)}
                                      className="w-full py-1 bg-[#1a4233] hover:bg-yellow-400 hover:text-slate-950 text-slate-200 text-xs font-bold rounded transition-colors"
                                    >
                                      Vrid ↻
                                    </button>
                                  </div>
                                ))}
                              </div>
                              <button 
                                onClick={checkWheelsSolution}
                                className="w-full py-3 bg-yellow-400 hover:bg-yellow-300 text-slate-950 font-black text-xs uppercase tracking-wider rounded-xl transition-all shadow-lg"
                              >
                                Lås upp kassaskåpet
                              </button>
                            </div>
                          )}

                          {errorMsg && (
                            <p className="text-xs text-rose-400 font-bold text-center mt-3 animate-shake">
                              {errorMsg}
                            </p>
                          )}
                        </div>
                      ) : (
                        <div className="text-center py-2">
                          <div className="w-14 h-14 bg-emerald-500/20 text-emerald-400 rounded-full flex items-center justify-center mx-auto mb-3 text-3xl border border-emerald-500/40">
                            ✓
                          </div>
                          <p className="text-emerald-300 font-bold text-sm mb-4 leading-relaxed">
                            {room.puzzle.rewardText}
                          </p>
                          <button 
                            onClick={handleCloseModal}
                            className="w-full py-3 bg-yellow-400 hover:bg-yellow-300 text-slate-950 font-black text-xs uppercase tracking-wider rounded-xl transition-all shadow-lg"
                          >
                            Fortsätt till dörren ➔
                          </button>
                        </div>
                      )}
                    </div>
                  )}

                  {/* MODAL 3: DÖRREN / EXIT */}
                  {activeModal === 'door' && (
                    <div>
                      {room.keyName && !room.doorCode ? (
                        <div className="text-center">
                          <p className="text-slate-300 text-sm mb-4 leading-relaxed">
                            Den här dörren är reglad och kräver: <br/>
                            <strong className="text-yellow-400 text-base">{room.keyName}</strong>.
                          </p>
                          {inventory.has(room.keyName) ? (
                            <div>
                              <p className="text-emerald-400 font-bold text-sm mb-4">
                                ✓ Du har {room.keyName} i ditt förråd!
                              </p>
                              <button 
                                onClick={handleDoorAction} 
                                className="w-full py-3 bg-yellow-400 hover:bg-yellow-300 text-slate-950 font-black text-xs uppercase tracking-wider rounded-xl transition-all shadow-lg"
                              >
                                Lås upp och gå till nästa rum ➔
                              </button>
                            </div>
                          ) : (
                            <div>
                              <p className="text-rose-400 text-xs font-semibold mb-4">
                                Du saknar nyckeln. Undersök rummet och lös det praktiska pusslet först!
                              </p>
                              <button 
                                onClick={handleCloseModal} 
                                className="w-full py-2.5 bg-slate-800 text-slate-300 font-bold rounded-xl text-xs uppercase"
                              >
                                Tillbaka till rummet
                              </button>
                            </div>
                          )}
                        </div>
                      ) : (
                        <div>
                          <p className="text-slate-300 text-sm mb-3">
                            Skriv in koden som avslöjades i anteckningsboken när pusslet löstes:
                          </p>
                          <form onSubmit={handleDoorAction} className="space-y-3">
                            <input 
                              type="text" 
                              value={doorInputCode}
                              onChange={(e) => setDoorInputCode(e.target.value)}
                              placeholder="SKRIV DÖRRKODEN HÄR..."
                              autoFocus
                              className="w-full py-3 px-4 bg-[#091813] border-2 border-[#1a4233] focus:border-yellow-400 rounded-xl text-center text-lg font-black text-white tracking-widest uppercase focus:outline-none"
                            />
                            {errorMsg && <p className="text-xs text-rose-400 font-bold text-center animate-shake">{errorMsg}</p>}
                            <button 
                              type="submit" 
                              className="w-full py-3 bg-yellow-400 hover:bg-yellow-300 text-slate-950 font-black text-xs uppercase tracking-wider rounded-xl transition-all shadow-lg"
                            >
                              Lås upp och gå till nästa rum ➔
                            </button>
                          </form>
                        </div>
                      )}
                    </div>
                  )}

                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<EscapeRoomApp />);
  </script>
</body>
</html>
