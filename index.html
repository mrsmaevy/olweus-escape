    function EscapeRoomApp() {
      const [currentRoomIndex, setCurrentRoomIndex] = useState(0);
      const [inventory, setInventory] = useState(new Set());
      const [clueRead, setClueRead] = useState(false);
      const [puzzleSolved, setPuzzleSolved] = useState(false);
      const [activeModal, setActiveModal] = useState(null); // 'clue', 'puzzle', 'doorLock', 'blocked'
      const [blockedMessage, setBlockedMessage] = useState("");
      
      const [reorderList, setReorderList] = useState([]);
      const [categorizedItems, setCategorizedItems] = useState({});
      const [selectedOptions, setSelectedOptions] = useState(new Set());
      
      const [keypadInput, setKeypadInput] = useState("");
      const [tumblerValues, setTumblerValues] = useState(["A", "A", "A", "A"]);
      const [isPadlockTurning, setIsPadlockTurning] = useState(false);
      
      const [errorMsg, setErrorMsg] = useState("");
      const [gameWon, setGameWon] = useState(false);

      const room = ROOMS[currentRoomIndex];

      const initRoom = (idx) => {
        const r = ROOMS[idx];
        setClueRead(false);
        setPuzzleSolved(false);
        setActiveModal(null);
        setErrorMsg("");
        setKeypadInput("");
        setTumblerValues(["A", "A", "A", "A"]);
        setIsPadlockTurning(false);

        if (r.puzzle.type === "reorder") {
          setReorderList([...r.puzzle.initial]);
        } else if (r.puzzle.type === "categorize") {
          const initCats = {};
          r.puzzle.items.forEach(it => initCats[it.id] = r.puzzle.categories[0]);
          setCategorizedItems(initCats);
        } else if (r.puzzle.type === "multiSelect") {
          setSelectedOptions(new Set());
        }
      };

      useEffect(() => {
        initRoom(0);
      }, []);

      // Spärrar för sekventiellt utforskande
      const handleTryOpenPuzzle = () => {
        if (!clueRead) {
          setBlockedMessage("Föremålet är låst! Du måste först undersöka och läsa ledtråden i rummet för att förstå vad som krävs för att lösa detta.");
          setActiveModal('blocked');
          return;
        }
        setActiveModal('puzzle');
        setErrorMsg("");
      };

      const handleTryOpenDoor = () => {
        if (!puzzleSolved) {
          setBlockedMessage("Dörren är helt reglad! Du måste lösa rummets praktiska utmaning och säkra nyckeln/koden innan låset kan öppnas.");
          setActiveModal('blocked');
          return;
        }
        setActiveModal('doorLock');
        setErrorMsg("");
      };

      const handleMoveItem = (index, delta) => {
        const target = index + delta;
        if (target < 0 || target >= reorderList.length) return;
        const copy = [...reorderList];
        const temp = copy[index];
        copy[index] = copy[target];
        copy[target] = temp;
        setReorderList(copy);
      };

      const checkReorder = () => {
        const ids = reorderList.map(i => i.id);
        const match = ids.every((val, i) => val === room.puzzle.correct[i]);
        if (match) {
          solvePuzzle();
        } else {
          setErrorMsg("Ordningsföljden är inte helt rätt än. Läs ledtråden noga för att förstå orsak och verkan!");
        }
      };

      const cycleCategory = (itemId) => {
        const cur = categorizedItems[itemId];
        const cats = room.puzzle.categories;
        const next = cats[(cats.indexOf(cur) + 1) % cats.length];
        setCategorizedItems(prev => ({ ...prev, [itemId]: next }));
      };

      const checkCategorize = () => {
        const match = room.puzzle.items.every(it => categorizedItems[it.id] === it.correct);
        if (match) {
          solvePuzzle();
        } else {
          setErrorMsg("Något av påståendena ligger i fel fack. Tänk efter utifrån skolans demokratiska principer!");
        }
      };

      const toggleMultiSelect = (id) => {
        const next = new Set(selectedOptions);

                          </p>

                          {inventory.has(room.keyItem) ? (
                            <button
                              onClick={handleTurnKeyInPadlock}
                              disabled={isPadlockTurning}
                              className="w-full py-3.5 bg-amber-400 hover:bg-amber-300 text-slate-950 font-black text-xs uppercase tracking-wider rounded-xl transition-all shadow-lg"
                            >
                              {isPadlockTurning ? "Låser upp..." : `🔑 Sätt i ${room.keyItem} och vrid om`}
                            </button>
                          ) : (
                            <div className="bg-[#091813] border border-rose-500/30 p-3 rounded-xl text-rose-300 text-xs mb-3">
                              Nyckeln saknas! Du måste lösa utmaningen i rummet först.
                            </div>
                          )}
                        </div>
                      )}

                      {room.doorType === "keypad" && (
                        <div>
                          <div className="bg-[#0284c7]/20 border border-[#0284c7] p-3 rounded-xl mb-4 font-mono text-2xl tracking-widest text-[#38bdf8] flex justify-center items-center h-12 shadow-inner">
                            {keypadInput.padEnd(4, "-")}
                          </div>

                          <div className="grid grid-cols-3 gap-2 max-w-[220px] mx-auto mb-4 font-mono font-bold">
                            {["1","2","3","4","5","6","7","8","9","C","0","OK"].map(k => (
                              <button
                                key={k}
                                onClick={() => {
                                  if (k === "C") handleKeypadClear();
                                  else if (k === "OK") handleKeypadSubmit();
                                  else handleKeypadPress(k);
                                }}
                                className={`h-11 rounded-xl text-sm transition-all ${
                                  k === "OK" 
                                    ? 'bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black' 
                                    : k === "C" 
                                      ? 'bg-rose-500 hover:bg-rose-400 text-white' 
                                      : 'bg-[#15392d] hover:bg-[#1f5543] text-white border border-[#235d49]'
                                }`}
                              >
                                {k}
                              </button>
                            ))}
                          </div>
                        </div>
                      )}

                      {room.doorType === "tumbler" && (
                        <div>
                          <p className="text-xs text-slate-300 mb-3">
                            Klicka på varje mässingshjul för att rotera fram rätt bokstavskod:
                          </p>

                          <div className="flex justify-center gap-2 mb-5">
                            {tumblerValues.map((val, idx) => (
                              <div key={idx} className="flex flex-col items-center">
                                <button 
                                  onClick={() => cycleTumbler(idx)}
                                  className="w-12 h-16 bg-[#ca8a04] hover:bg-amber-400 text-slate-950 border-2 border-[#713f12] rounded-xl flex items-center justify-center font-mono font-black text-2xl shadow-inner transition-colors"
                                >
                                  {val}
                                </button>
                                <span className="text-[10px] text-slate-400 mt-1">↻ Vrid</span>
                              </div>
                            ))}
                          </div>

                          <button
                            onClick={checkTumbler}
                            className="w-full py-3.5 bg-amber-400 hover:bg-amber-300 text-slate-950 font-black text-xs uppercase tracking-wider rounded-xl transition-all shadow-lg"
                          >
                            Testa kombinationen
                          </button>
                        </div>
                      )}

                      {errorMsg && (
                        <p className="text-xs text-rose-400 font-bold text-center mt-3 animate-shake">
                          {errorMsg}
                        </p>
                      )}
                    </div>
                  )}

                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<EscapeRoomApp />);
  </script>
</body>
</html>
