    function EscapeRoomApp() {
      const [currentRoomIndex, setCurrentRoomIndex] = useState(0);
      const [inventory, setInventory] = useState(new Set());
      const [clueRead, setClueRead] = useState(false);
      const [puzzleSolved, setPuzzleSolved] = useState(false);
      const [activeModal, setActiveModal] = useState(null); // 'clue', 'puzzle', 'doorLock', 'blocked'
      const [blockedMessage, setBlockedMessage] = useState("");
      
      const [reorderList, setReorderList] = useState([]);
      const [categorizedItems, setCategorizedItems] = useState({});
      const [selectedOptions, setSelectedOptions] = useState(new Set());
      
      // Dörrlåstillstånd
      const [enteredCode, setEnteredCode] = useState("");
      const [tumblerValues, setTumblerValues] = useState(["A", "A", "A", "A"]);
      const [isPadlockTurning, setIsPadlockTurning] = useState(false);
      
      const [errorMsg, setErrorMsg] = useState("");
      const [gameWon, setGameWon] = useState(false);

      const room = ROOMS[currentRoomIndex];

      const initRoom = (idx) => {
        const r = ROOMS[idx];
        setClueRead(false);
        setPuzzleSolved(false);
        setActiveModal(null);
        setErrorMsg("");
        setEnteredCode("");
        setTumblerValues(["A", "A", "A", "A"]);
        setIsPadlockTurning(false);

        if (r.puzzle.type === "reorder") {
          setReorderList([...r.puzzle.initial]);
        } else if (r.puzzle.type === "categorize") {
          const initCats = {};
          r.puzzle.items.forEach(it => initCats[it.id] = r.puzzle.categories[0]);
          setCategorizedItems(initCats);
        } else if (r.puzzle.type === "multiSelect") {
          setSelectedOptions(new Set());
        }
      };

      useEffect(() => {
        initRoom(0);
      }, []);

      const handleTryOpenPuzzle = () => {
        if (!clueRead) {
          setBlockedMessage("Föremålet är spärrat! Du måste först undersöka och läsa ledtråden i rummet för att förstå vad som krävs för att lösa detta.");
          setActiveModal('blocked');
          return;
        }
        setActiveModal('puzzle');
        setErrorMsg("");
      };

      const handleTryOpenDoor = () => {
        if (!puzzleSolved) {
          setBlockedMessage("Dörren är reglad! Du måste lösa rummets praktiska utmaning och säkra nyckeln/koden innan låset kan öppnas.");
          setActiveModal('blocked');
          return;
        }
        setActiveModal('doorLock');
        setErrorMsg("");
      };

      const handleMoveItem = (index, delta) => {
        const target = index + delta;
        if (target < 0 || target >= reorderList.length) return;
        const copy = [...reorderList];
        const temp = copy[index];
        copy[index] = copy[target];
        copy[target] = temp;
        setReorderList(copy);
      };

      const checkReorder = () => {
        const ids = reorderList.map(i => i.id);
        if (ids.every((val, i) => val === room.puzzle.correct[i])) {
          solvePuzzle();
        } else {
          setErrorMsg("Ordningsföljden är inte helt rätt än. Läs ledtråden noga!");
        }
      };

      const cycleCategory = (itemId) => {
        const cur = categorizedItems[itemId];
        const cats = room.puzzle.categories;
        const next = cats[(cats.indexOf(cur) + 1) % cats.length];
        setCategorizedItems(prev => ({ ...prev, [itemId]: next }));
      };

      const checkCategorize = () => {
        if (room.puzzle.items.every(it => categorizedItems[it.id] === it.correct)) {
          solvePuzzle();
        } else {
          setErrorMsg("Något av påståendena ligger i fel fack. Tänk efter utifrån skolans demokratiska principer!");
        }
      };

      const toggleMultiSelect = (id) => {
        const next = new Set(selectedOptions);
        if (next.has(id)) next.delete(id);
        else if (next.size < room.puzzle.requiredCount) next.add(id);
        setSelectedOptions(next);
      };

      const checkMultiSelect = () => {
        if (selectedOptions.size !== room.puzzle.requiredCount) {
          setErrorMsg(`Du måste välja exakt ${room.puzzle.requiredCount} alternativ.`);
          return;
        }
        if (room.puzzle.options.filter(o => o.correct).every(o => selectedOptions.has(o.id))) {
          solvePuzzle();
        } else {
          setErrorMsg("Dina val stämmer inte med definitionen. Läs texten noggrant!");
        }
      };

      const solvePuzzle = () => {
        setPuzzleSolved(true);
        setErrorMsg("");
        if (room.keyItem) {
          setInventory(prev => new Set(prev).add(room.keyItem));

                    {puzzleSolved ? "✓ SKRIN UPPLÅST" : clueRead ? "2. ÖPPNA SKRINET" : "🔒 SPÄRRAT"}
                  </text>
                </g>
              </g>
            );

          case 10: // REKTORN
            return (
              <g>
                <rect x="0" y="0" width="800" height="320" fill="#312e81" />
                <rect x="0" y="320" width="800" height="180" fill="#451a03" />

                <g className="interactive-item" onClick={() => { setClueRead(true); setActiveModal('clue'); }}>
                  <rect x="170" y="50" width="170" height="130" fill="#fef08a" stroke="#ca8a04" strokeWidth="8" rx="4" />
                  <circle cx="255" cy="100" r="25" fill="#eab308" />
                  <rect x="185" y="145" width="140" height="20" fill={clueRead ? "#15803d" : "#0f172a"} rx="2" />
                  <text x="255" y="159" fill="#ffffff" fontSize="9" fontWeight="bold" textAnchor="middle">
                    {clueRead ? "✓ DIPLOM STUDERAT" : "1. LÄS DIPLOMET"}
                  </text>
                </g>

                <g className="interactive-item" onClick={handleTryOpenPuzzle}>
                  <rect x="370" y="240" width="230" height="90" fill="#78350f" stroke="#451a03" strokeWidth="6" rx="4" />
                  <rect x="410" y="200" width="40" height="15" fill="#15803d" rx="3" />
                  <rect x="400" y="295" width="170" height="22" fill={puzzleSolved ? "#15803d" : clueRead ? "#b45309" : "#0f172a"} rx="3" />
                  <text x="485" y="310" fill="#ffffff" fontSize="9" fontWeight="bold" textAnchor="middle">
                    {puzzleSolved ? "✓ PÄRM ÖPPNAD" : clueRead ? "2. LÖS SISTA PUSSLET" : "🔒 SPÄRRAD"}
                  </text>
                </g>
              </g>
            );

          default:
            return null;
        }
      };

      if (gameWon) {
        return (
          <div className="min-h-screen bg-[#06120e] flex items-center justify-center p-4">
            <div className="bg-[#0c221a] border-2 border-amber-400 rounded-3xl p-10 max-w-xl text-center shadow-2xl">
              <div className="w-24 h-24 mx-auto mb-6 bg-amber-400/20 rounded-full flex items-center justify-center border-2 border-amber-400 text-5xl">
                🏆
              </div>
              <h1 className="text-3xl font-extrabold text-amber-400 mb-3 uppercase tracking-wider">Alla 10 rum avklarade!</h1>
              <p className="text-slate-300 text-lg mb-8 leading-relaxed">
                Ni har tagit er igenom alla skolans praktiska utmaningar, brutit destruktiva normer och visat hur ett genuint tryggt och inkluderande <strong>SKOLKLIMAT</strong> skapas varje dag!
              </p>
              <button 
                onClick={() => { setCurrentRoomIndex(0); setInventory(new Set()); setGameWon(false); initRoom(0); }}
                className="px-8 py-3.5 bg-amber-400 hover:bg-amber-300 text-slate-950 font-black rounded-xl transition-all shadow-lg hover:scale-105 uppercase tracking-wider"
              >
                Börja om från Rum 1
              </button>
            </div>
          </div>
        );
      }

      return (
        <div className="w-full max-w-5xl mx-auto flex flex-col justify-between">
          
          {/* HEADER */}
          <header className="w-full mb-3 flex flex-col md:flex-row md:items-center md:justify-between gap-3 bg-[#0d221b] p-4 rounded-2xl border border-[#194435] shadow-lg">
            <div>
              <div className="flex items-center gap-2">
                <span className="px-2.5 py-0.5 rounded-full text-xs font-bold bg-amber-400/20 text-amber-300 border border-amber-400/30 uppercase tracking-wider">
                  RUM {currentRoomIndex + 1} AV {ROOMS.length}
                </span>
                <span className="text-xs text-slate-400">• Olweus & HateLess</span>
              </div>
              <h1 className="text-2xl font-black text-white mt-0.5">{room.title}</h1>
              <p className="text-xs text-slate-300">{room.subtitle}</p>
            </div>

            <div className="flex items-center gap-1.5 overflow-x-auto py-1">
              {ROOMS.map((r, idx) => (
                <div 
                  key={r.id} 
                  className={`w-7 h-7 rounded-lg flex items-center justify-center text-xs font-bold transition-all ${
                    idx === currentRoomIndex 
                      ? 'bg-amber-400 text-slate-950 scale-110 font-black ring-2 ring-amber-200' 
                      : idx < currentRoomIndex 
                        ? 'bg-emerald-800 text-emerald-200' 
                        : 'bg-slate-800 text-slate-500 border border-slate-700'
                  }`}
                >
                  {idx + 1}
                </div>
              ))}
            </div>
          </header>

          {/* ================= SVG-RUMMET ================= */}
          <main className="w-full relative aspect-[16/10] max-h-[480px] bg-[#07130e] rounded-3xl overflow-hidden border-4 border-[#14392c] shadow-2xl">
            <div key={currentRoomIndex} className="w-full h-full animate-room-change">
              <svg viewBox="0 0 800 500" className="w-full h-full select-none">
                
                {renderRoomIllustration(room.id)}

                {/* DÖRREN LÄNGST TILL HÖGER */}
                <g className="interactive-item" onClick={handleTryOpenDoor}>
                  <rect x="640" y="70" width="120" height="290" fill="#0f172a" stroke="#334155" strokeWidth="6" rx="4" />
                  <rect x="650" y="80" width="100" height="270" fill={puzzleSolved ? "#15803d" : "#991b1b"} className="transition-colors" />
                  <rect x="660" y="50" width="80" height="22" fill="#dc2626" rx="3" />
                  <text x="700" y="65" fill="#ffffff" fontSize="10" fontWeight="black" textAnchor="middle">{room.doorLabel}</text>
                  
                  {room.doorType === "padlock" && (
                    <g transform="translate(685, 190)">
                      <rect x="0" y="15" width="30" height="25" fill="#facc15" stroke="#b45309" strokeWidth="2" rx="4" />
                      <path d="M 7 15 C 7 5, 23 5, 23 15" fill="none" stroke="#e2e8f0" strokeWidth="4" />
                      <circle cx="15" cy="27" r="3" fill="#78350f" />
                    </g>
                  )}

                  {room.doorType === "keypad" && (
                    <g transform="translate(685, 180)">
                      <rect x="0" y="0" width="30" height="42" fill="#1e293b" stroke="#64748b" strokeWidth="2" rx="3" />
                      <rect x="4" y="4" width="22" height="10" fill="#0284c7" />
                      <circle cx="8" cy="22" r="2" fill="#94a3b8" />
                      <circle cx="15" cy="22" r="2" fill="#94a3b8" />
                      <circle cx="22" cy="22" r="2" fill="#94a3b8" />
                    </g>
                  )}

                  {room.doorType === "tumbler" && (
                    <g transform="translate(680, 190)">
                      <rect x="0" y="0" width="40" height="25" fill="#ca8a04" stroke="#713f12" strokeWidth="2" rx="3" />
                      <line x1="10" y1="0" x2="10" y2="25" stroke="#713f12" strokeWidth="1" />
                      <line x1="20" y1="0" x2="20" y2="25" stroke="#713f12" strokeWidth="1" />
                      <line x1="30" y1="0" x2="30" y2="25" stroke="#713f12" strokeWidth="1" />
                    </g>
                  )}

                  <rect x="655" y="320" width="90" height="20" fill={puzzleSolved ? "#22c55e" : "#450a0a"} rx="2" />
                  <text x="700" y="334" fill="#ffffff" fontSize="9" fontWeight="bold" textAnchor="middle">
                    {puzzleSolved ? "3. LÅS UPP HÄR" : "LÅST"}
                  </text>
                </g>

              </svg>
            </div>
          </main>

          {/* ================= BOTTENPANEL ================= */}
          <footer className="w-full mt-3 bg-[#0d221b] border border-[#194435] rounded-2xl p-4 flex flex-col md:flex-row items-center justify-between gap-4 shadow-xl">
            <div className="flex items-center gap-3">
              <span className="w-9 h-9 rounded-full bg-amber-400/20 text-amber-300 border border-amber-400/40 flex items-center justify-center font-bold text-sm">
                {!clueRead ? "1" : !puzzleSolved ? "2" : "3"}
              </span>
              <div>
                <span className="text-[10px] uppercase font-bold text-slate-400 tracking-wider block">Aktuellt steg</span>
                <p className="text-sm font-semibold text-white">
                  {!clueRead 
                    ? `Undersök ${room.cluePrompt} i rummet` 
                    : !puzzleSolved 
                      ? `Lös pusslet vid ${room.puzzlePrompt}` 
                      : `Gå till ${room.doorLabel} och öppna låset!`}
                </p>
              </div>
            </div>

            <div className="flex items-center gap-2 bg-[#081813] px-4 py-2 rounded-xl border border-[#15392d]">
              <span className="text-xs font-bold text-slate-400 uppercase tracking-wider">Ficka:</span>
              {inventory.size === 0 ? (
                <span className="text-xs text-slate-500 italic">Inga föremål</span>
              ) : (
                Array.from(inventory).map(item => (
                  <span key={item} className="text-xs font-bold bg-amber-400 text-slate-950 px-2 py-0.5 rounded shadow">
                    🔑 {item}
                  </span>
                ))
              )}
            </div>

            <div className="flex gap-2">
              <button 
                onClick={() => { setClueRead(true); setActiveModal('clue'); }}
                className="px-3 py-1.5 bg-[#15392d] hover:bg-[#1d4d3d] text-slate-200 text-xs font-bold rounded-lg border border-[#235d49] transition-colors"
              >
                📖 Ledtråd
              </button>
              <button 
                onClick={handleTryOpenPuzzle}
                className={`px-3 py-1.5 text-xs font-bold rounded-lg transition-colors ${clueRead ? 'bg-amber-400 hover:bg-amber-300 text-slate-950' : 'bg-slate-800 text-slate-500 border border-slate-700'}`}
              >
                ⚙️ Pussel
              </button>
              <button 
                onClick={handleTryOpenDoor}
                className={`px-3 py-1.5 text-xs font-bold rounded-lg transition-colors ${puzzleSolved ? 'bg-emerald-500 hover:bg-emerald-400 text-slate-950' : 'bg-slate-800 text-slate-500 border border-slate-700'}`}
              >
                🔐 Lås
              </button>
            </div>
          </footer>

          {/* ================= MODALER ================= */}
          {activeModal && (
            <div className="fixed inset-0 bg-black/85 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-[#0c221a] border-2 border-[#1a4233] rounded-2xl max-w-lg w-full overflow-hidden shadow-2xl animate-room-change">
                
                <div className="px-5 py-3.5 bg-[#081813] border-b border-[#1a4233] flex justify-between items-center">
                  <h3 className="font-bold text-white text-sm flex items-center gap-2">
                    {activeModal === 'clue' && '🔍 ' + room.clue.title}
                    {activeModal === 'puzzle' && '⚙️ ' + room.puzzle.title}
                    {activeModal === 'doorLock' && '🔐 ' + room.doorLabel + ' – Låsmekanism'}
                    {activeModal === 'blocked' && '🔒 Åtkomst spärrad'}
                  </h3>
                  <button onClick={() => setActiveModal(null)} className="text-slate-300 hover:text-white text-xs px-2.5 py-1 bg-white/10 hover:bg-white/20 rounded-md">
                    Stäng X
                  </button>
                </div>

                <div className="p-6 max-h-[80vh] overflow-y-auto">
                  
                  {activeModal === 'blocked' && (
                    <div className="text-center py-3">
                      <div className="w-14 h-14 bg-rose-500/20 text-rose-400 rounded-full flex items-center justify-center mx-auto mb-3 text-3xl border border-rose-500/40">
                        🔒
                      </div>
                      <p className="text-slate-200 text-sm leading-relaxed mb-5">
                        {blockedMessage}
                      </p>
                      <button 
                        onClick={() => { setClueRead(true); setActiveModal('clue'); }}
                        className="w-full py-3 bg-amber-400 hover:bg-amber-300 text-slate-950 font-bold rounded-xl transition-all shadow-md uppercase tracking-wider text-xs"
                      >
                        Öppna och studera ledtråden ➔
                      </button>
                    </div>
                  )}

                  {activeModal === 'clue' && (
                    <div>
                      <div className="relative bg-[#fbf7ee] text-slate-800 p-6 rounded-xl shadow-lg border border-amber-200 mb-5">
                        <div className="absolute -top-3 left-1/2 -translate-x-1/2 w-6 h-6 bg-red-600 rounded-full border-2 border-red-700 shadow-md"></div>
                        <p className="font-handwriting text-2xl leading-relaxed text-slate-900 pt-2 text-center">
                          "{room.clue.text}"
                        </p>
                      </div>
                      <button 
                        onClick={() => { setActiveModal('puzzle'); }}
                        className="w-full py-3 bg-amber-400 hover:bg-amber-300 text-slate-950 font-bold rounded-xl transition-all shadow-md uppercase tracking-wider text-xs"
                      >
                        Gå vidare till utmaningen ➔
                      </button>
                    </div>
                  )}

                  {activeModal === 'puzzle' && (
                    <div>
                      {!puzzleSolved ? (
                        <div>
                          <p className="text-xs text-amber-300 font-bold uppercase tracking-wider mb-3">
                            {room.puzzle.instruction}
                          </p>

                          {room.puzzle.type === "reorder" && (
                            <div className="space-y-2 mb-4">
                              {reorderList.map((it, idx) => (
                                <div key={it.id} className="bg-[#122e23] border border-[#1b4b39] p-3 rounded-xl flex items-center justify-between gap-3 text-xs">
                                  <span className="font-medium text-slate-200">{it.text}</span>
                                  <div className="flex gap-1 shrink-0">
                                    <button 
                                      disabled={idx === 0}
                                      onClick={() => handleMoveItem(idx, -1)}
                                      className="px-2 py-1 bg-[#1a4233] hover:bg-amber-400 hover:text-slate-950 disabled:opacity-30 rounded font-bold transition-colors"
                                    >
                                      ▲
                                    </button>
                                    <button 
                                      disabled={idx === reorderList.length - 1}
                                      onClick={() => handleMoveItem(idx, 1)}
                                      className="px-2 py-1 bg-[#1a4233] hover:bg-amber-400 hover:text-slate-950 disabled:opacity-30 rounded font-bold transition-colors"
                                    >
                                      ▼
                                    </button>
                                  </div>
                                </div>
                              ))}
                              <button 
                                onClick={checkReorder}
                                className="w-full py-3 bg-amber-400 hover:bg-amber-300 text-slate-950 font-black text-xs uppercase tracking-wider rounded-xl transition-all shadow-lg mt-3"
                              >
                                Kontrollera ordningsföljden
                              </button>
                            </div>
                          )}

                          {room.puzzle.type === "categorize" && (
                            <div className="space-y-2.5 mb-4">
                              {room.puzzle.items.map(it => (
                                <div key={it.id} className="bg-[#122e23] border border-[#1b4b39] p-3 rounded-xl text-xs flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                                  <span className="text-slate-200">{it.text}</span>
                                  <button
                                    onClick={() => cycleCategory(it.id)}
                                    className="px-3 py-1.5 bg-[#1a4233] hover:bg-amber-400 hover:text-slate-950 text-amber-300 font-bold rounded-lg border border-[#27634d] transition-colors self-end sm:self-auto shrink-0"
                                  >
                                    {categorizedItems[it.id]} ⇄
                                  </button>
                                </div>
                              ))}
                              <button 
                                onClick={checkCategorize}
                                className="w-full py-3 bg-amber-400 hover:bg-amber-300 text-slate-950 font-black text-xs uppercase tracking-wider rounded-xl transition-all shadow-lg mt-3"
                              >
                                Kontrollera sorteringen
                              </button>
                            </div>
                          )}

                          {room.puzzle.type === "multiSelect" && (
                            <div className="space-y-2 mb-4">
                              {room.puzzle.options.map(opt => {
                                const isSel = selectedOptions.has(opt.id);
                                return (
                                  <button
                                    key={opt.id}
                                    onClick={() => toggleMultiSelect(opt.id)}
                                    className={`w-full text-left p-3 rounded-xl border text-xs leading-relaxed transition-all flex items-start gap-2.5 ${
                                      isSel
                                        ? 'bg-amber-400/20 border-amber-400 text-amber-200'
                                        : 'bg-[#122e23] hover:bg-[#1a4233] border-[#1b4b39] text-slate-200'
                                    }`}
                                  >
                                    <span className={`w-4 h-4 rounded border flex items-center justify-center shrink-0 mt-0.5 ${isSel ? 'bg-amber-400 text-slate-950 border-amber-400 font-bold' : 'border-slate-500'}`}>
                                      {isSel ? '✓' : ''}
                                    </span>
                                    <span>{opt.text}</span>
                                  </button>
                                );
                              })}
                              <button 
                                onClick={checkMultiSelect}
                                className="w-full py-3 bg-amber-400 hover:bg-amber-300 text-slate-950 font-black text-xs uppercase tracking-wider rounded-xl transition-all shadow-lg mt-3"
                              >
                                Kontrollera valda ({selectedOptions.size} av {room.puzzle.requiredCount})
                              </button>
                            </div>
                          )}

                          {errorMsg && (
                            <p className="text-xs text-rose-400 font-bold text-center mt-3 animate-shake">
                              {errorMsg}
                            </p>
                          )}
                        </div>
                      ) : (
                        <div className="text-center py-2">
                          <div className="w-14 h-14 bg-emerald-500/20 text-emerald-400 rounded-full flex items-center justify-center mx-auto mb-3 text-3xl border border-emerald-500/40">
                            ✓
                          </div>
                          <p className="text-emerald-300 font-bold text-sm mb-4 leading-relaxed">
                            {room.puzzle.rewardText}
                          </p>
                          <button 
                            onClick={() => setActiveModal('doorLock')}
                            className="w-full py-3 bg-amber-400 hover:bg-amber-300 text-slate-950 font-black text-xs uppercase tracking-wider rounded-xl transition-all shadow-lg"
                          >
                            Gå till dörren och lås upp ➔
                          </button>
                        </div>
                      )}
                    </div>
                  )}

                  {activeModal === 'doorLock' && (
                    <div className="text-center">
                      
                      {room.doorType === "padlock" && (
                        <div>
                          <div className="w-28 h-36 mx-auto mb-5 relative">
                            <svg viewBox="0 0 100 120" className={`w-full h-full ${isPadlockTurning ? 'animate-unlock' : ''}`}>
                              <path 
                                d={isPadlockTurning ? "M 30 45 C 30 15, 70 15, 70 30" : "M 30 45 C 30 15, 70 15, 70 45"} 
                                fill="none" 
                                stroke="#e2e8f0" 
                                strokeWidth="12" 
                                strokeLinecap="round" 
                              />
                              <rect x="15" y="45" width="70" height="65" fill="#eab308" stroke="#ca8a04" strokeWidth="4" rx="10" />
                              <circle cx="50" cy="72" r="8" fill="#713f12" />
                              <polygon points="46,72 54,72 52,90 48,90" fill="#713f12" />
                            </svg>
                          </div>

                          <p className="text-slate-300 text-xs mb-4">
                            Detta lås kräver <strong>{room.keyItem}</strong> för att låsas upp.
                          </p>

                          {inventory.has(room.keyItem) ? (
                            <button
                              onClick={handleTurnKeyInPadlock}
                              disabled={isPadlockTurning}
                              className="w-full py-3.5 bg-amber-400 hover:bg-amber-300 text-slate-950 font-black text-xs uppercase tracking-wider rounded-xl transition-all shadow-lg"
                            >
                              {isPadlockTurning ? "Låser upp..." : `🔑 Sätt i ${room.keyItem} och vrid om`}
                            </button>
                          ) : (
                            <div className="bg-[#091813] border border-rose-500/30 p-3 rounded-xl text-rose-300 text-xs mb-3">
                              Nyckeln saknas! Du måste lösa utmaningen i rummet först.
                            </div>
                          )}
                        </div>
                      )}

                      {room.doorType === "keypad" && (
                        <div>
                          <div className="bg-[#0284c7]/20 border border-[#0284c7] p-3 rounded-xl mb-4 font-mono text-2xl tracking-widest text-[#38bdf8] flex justify-center items-center h-12 shadow-inner">
                            {enteredCode.padEnd(room.doorCode.length, "-")}
                          </div>

                          <div className="grid grid-cols-3 gap-2 max-w-[220px] mx-auto mb-4 font-mono font-bold">
                            {["1","2","3","4","5","6","7","8","9","C","0","OK"].map(k => (
                              <button
                                key={k}
                                onClick={() => {
                                  if (k === "C") handleKeypadClear();
                                  else if (k === "OK") handleKeypadSubmit();
                                  else handleKeypadPress(k);
                                }}
                                className={`h-11 rounded-xl text-sm transition-all ${
                                  k === "OK" 
                                    ? 'bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black' 
                                    : k === "C" 
                                      ? 'bg-rose-500 hover:bg-rose-400 text-white' 
                                      : 'bg-[#15392d] hover:bg-[#1f5543] text-white border border-[#235d49]'
                                }`}
                              >
                                {k}
                              </button>
                            ))}
                          </div>
                        </div>
                      )}

                      {room.doorType === "tumbler" && (
                        <div>
                          <p className="text-xs text-slate-300 mb-3">
                            Klicka på varje mässingshjul för att rotera fram rätt bokstavskod:
                          </p>

                          <div className="flex justify-center gap-2 mb-5">
                            {tumblerValues.map((val, idx) => (
                              <div key={idx} className="flex flex-col items-center">
                                <button 
                                  onClick={() => cycleTumbler(idx)}
                                  className="w-12 h-16 bg-[#ca8a04] hover:bg-amber-400 text-slate-950 border-2 border-[#713f12] rounded-xl flex items-center justify-center font-mono font-black text-2xl shadow-inner transition-colors"
                                >
                                  {val}
                                </button>
                                <span className="text-[10px] text-slate-400 mt-1">↻ Vrid</span>
                              </div>
                            ))}
                          </div>

                          <button
                            onClick={checkTumbler}
                            className="w-full py-3.5 bg-amber-400 hover:bg-amber-300 text-slate-950 font-black text-xs uppercase tracking-wider rounded-xl transition-all shadow-lg"
                          >
                            Testa kombinationen
                          </button>
                        </div>
                      )}

                      {errorMsg && (
                        <p className="text-xs text-rose-400 font-bold text-center mt-3 animate-shake">
                          {errorMsg}
                        </p>
                      )}
                    </div>
                  )}

                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<EscapeRoomApp />);
  </script>
</body>
</html>
