                  </div>
                </div>
                
                <ul className="space-y-1 font-handwriting text-xl text-slate-900 leading-snug">
                  {!discoveredClue && !dilemmaSolved && (
                    <li className="text-slate-400 italic text-lg list-none pt-2">
                      Klicka på sakerna som glittrar i rummet för att undersöka situationen...
                    </li>
                  )}
                  {discoveredClue && (
                    <li className="flex items-start gap-2">
                      <span className="text-emerald-700 font-bold">✔</span>
                      <span>{room.clueObject.notebook}</span>
                    </li>
                  )}
                  {dilemmaSolved && (
                    <li className="flex items-start gap-2 font-bold text-emerald-800">
                      <span className="text-emerald-700">✔</span>
                      <span>{room.dilemmaObject.rewardNote}</span>
                    </li>
                  )}
                </ul>
              </div>

              <div className="text-[11px] text-slate-400 pt-2 border-t border-amber-100 flex justify-between">
                <span>Gör ett genomtänkt moraliskt val för att låsa upp nästa rum.</span>
                <span>{dilemmaSolved ? "Dilemma avklarat!" : "Dilemma olöst"}</span>
              </div>
            </div>

            {/* Fastnat-panel */}
            <div className="bg-[#111c24] rounded-2xl p-4 shadow-xl border border-slate-800 flex flex-col justify-between">
              <div>
                <h3 className="text-sm font-bold text-white mb-1 flex items-center gap-1.5">
                  <span className="text-yellow-400">💡</span> Behöver ni hjälp?
                </h3>
                <p className="text-xs text-slate-300 mb-3">
                  Diskutera dilemmat i gruppen: Vilket alternativ stödjer den utsatta och skapar trygghet?
                </p>
              </div>

              {showHint ? (
                <div className="p-2.5 bg-yellow-400/10 border border-yellow-400/30 rounded-xl text-xs text-yellow-300">
                  <strong>Reflektionstips:</strong> Tänk på Olweus princip: Den som är tyst stödjer mobbaren. Den som agerar visar civilkurage.
                </div>
              ) : (
                <button 
                  onClick={() => setShowHint(true)}
                  className="w-full py-2.5 bg-slate-800 hover:bg-slate-700 text-yellow-300 text-xs font-bold rounded-xl border border-yellow-400/30 transition-colors"
                >
                  Visa tips
                </button>
              )}
            </div>
          </footer>

          {/* ================= MODAL / POPUP ================= */}
          {activeModal && (
            <div className="fixed inset-0 bg-black/85 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-[#111c24] border-2 border-slate-700 rounded-2xl max-w-lg w-full overflow-hidden shadow-2xl animate-room-change">
                
                {/* Header */}
                <div className="px-5 py-3.5 bg-slate-800/80 border-b border-slate-700 flex justify-between items-center">
                  <h3 className="font-bold text-white text-sm flex items-center gap-2">
                    {activeModal === 'door' && '🔐 ' + room.doorLabel}
                    {activeModal === 'clue' && '🔍 ' + room.clueObject.name}
                    {activeModal === 'dilemma' && '⚖️ ' + room.dilemmaObject.title}
                  </h3>
                  <button onClick={handleCloseModal} className="text-slate-400 hover:text-white text-xs px-2.5 py-1 bg-slate-700 rounded-md">
                    Stäng ✕
                  </button>
                </div>

                {/* Innehåll */}
                <div className="p-6">
                  
                  {/* MODAL 1: LEDTRÅDS-OBJEKTET */}
                  {activeModal === 'clue' && (
                    <div>
                      <div className="bg-[#fdfaf3] text-slate-800 p-5 rounded-xl mb-5 font-handwriting text-2xl leading-snug shadow-inner border border-amber-200">
                        "{room.clueObject.text}"
                      </div>
                      <button 
                        onClick={handleCloseModal} 
                        className="w-full py-3 bg-yellow-400 hover:bg-yellow-300 text-slate-950 font-bold rounded-xl transition-all shadow-md uppercase tracking-wider text-xs"
                      >
                        Anteckna i boken
                      </button>
                    </div>
                  )}

                  {/* MODAL 2: DET MORALISKA DILEMMAT */}
                  {activeModal === 'dilemma' && (
                    <div>
                      <div className="bg-slate-900/90 border border-slate-700 p-4 rounded-xl mb-4">
                        <span className="text-[11px] font-bold text-amber-400 uppercase tracking-wider block mb-1">Situation:</span>
                        <p className="text-slate-200 text-sm leading-relaxed">
                          {room.dilemmaObject.situation}
                        </p>
                      </div>

                      <p className="text-yellow-400 text-xs font-bold uppercase tracking-wider mb-2">
                        {room.dilemmaObject.question}
                      </p>

                      {/* Alternativen A, B, C */}
                      <div className="space-y-2 mb-4">
                        {room.dilemmaObject.options.map((opt) => (
                          <button
                            key={opt.id}
                            disabled={dilemmaSolved}
                            onClick={() => handleSelectOption(opt)}
                            className={`w-full text-left p-3 rounded-xl border text-xs leading-relaxed transition-all flex items-start gap-2.5 ${
                              selectedOptionId === opt.id
                                ? opt.isCorrect
                                  ? 'bg-emerald-950/80 border-emerald-500 text-emerald-200'
                                  : 'bg-rose-950/80 border-rose-500 text-rose-200 animate-shake'
                                : 'bg-slate-800/80 hover:bg-slate-700/80 border-slate-700 text-slate-200'
                            }`}
                          >
                            <span className="font-bold text-amber-400 shrink-0">{opt.id}.</span>
                            <span>{opt.text}</span>
                          </button>
                        ))}
                      </div>

                      {/* Pedagogisk Feedback */}
                      {optionFeedback && (
                        <div className={`p-3.5 rounded-xl text-xs leading-relaxed mb-4 border ${
                          optionFeedback.isCorrect 
                            ? 'bg-emerald-500/10 border-emerald-500/40 text-emerald-300' 
                            : 'bg-rose-500/10 border-rose-500/40 text-rose-300'
                        }`}>
                          <strong className="block mb-1 font-bold">
                            {optionFeedback.isCorrect ? '✓ Rätt val och analys:' : '⚠ Tänk ett varv till:'}
                          </strong>
                          {optionFeedback.feedback}
                        </div>
                      )}

                      {dilemmaSolved && (
                        <button 
                          onClick={handleCloseModal}
                          className="w-full py-3 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black text-xs uppercase tracking-wider rounded-xl transition-all shadow-lg"
                        >
                          Fortsätt till dörren ➔
                        </button>
                      )}
                    </div>
                  )}

                  {/* MODAL 3: HUVUDDÖRREN */}
                  {activeModal === 'door' && (
                    <div>
                      {room.keyItemName && !room.doorCode ? (
                        <div className="text-center">
                          <p className="text-slate-300 text-sm mb-4 leading-relaxed">
                            Dörren är låst. För att öppna krävs: <br/>
                            <strong className="text-yellow-400 text-base">{room.keyItemName}</strong>.
                          </p>
                          {inventory.has(room.keyItemName) ? (
                            <div>
                              <p className="text-emerald-400 font-bold text-sm mb-4">
                                ✓ Du har {room.keyItemName} i ditt förråd!
                              </p>
                              <button 
                                onClick={handleDoorAction} 
                                className="w-full py-3 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black text-xs uppercase tracking-wider rounded-xl transition-all shadow-lg"
                              >
                                Lås upp och gå till nästa rum ➔
                              </button>
                            </div>
                          ) : (
                            <div>
                              <p className="text-rose-400 text-xs font-semibold mb-4">
                                Du saknar nyckeln. Lös dilemmat i rummet för att få den!
                              </p>
                              <button 
                                onClick={handleCloseModal} 
                                className="w-full py-2.5 bg-slate-800 text-slate-300 font-bold rounded-xl text-xs uppercase"
                              >
                                Tillbaka till rummet
                              </button>
                            </div>
                          )}
                        </div>
                      ) : (
                        <div>
                          <p className="text-slate-300 text-sm mb-3">
                            Skriv in koden som avslöjades när ni löste dilemmat:
                          </p>
                          <form onSubmit={handleDoorAction} className="space-y-3">
                            <input 
                              type="text" 
                              value={doorInputCode}
                              onChange={(e) => setDoorInputCode(e.target.value)}
                              placeholder="SKRIV DÖRRKODEN HÄR..."
                              autoFocus
                              className="w-full py-3 px-4 bg-slate-950 border-2 border-slate-700 focus:border-yellow-400 rounded-xl text-center text-lg font-black text-white tracking-widest uppercase focus:outline-none"
                            />
                            {errorMsg && <p className="text-xs text-rose-400 font-bold text-center animate-shake">{errorMsg}</p>}
                            <button 
                              type="submit" 
                              className="w-full py-3 bg-yellow-400 hover:bg-yellow-300 text-slate-950 font-black text-xs uppercase tracking-wider rounded-xl transition-all shadow-lg"
                            >
                              Lås upp och gå till nästa rum ➔
                            </button>
                          </form>
                        </div>
                      )}
                    </div>
                  )}

                </div>

              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<EscapeRoomApp />);
  </script>
</body>
</html>
