    /* Sims Plumbob animation */
    @keyframes plumbob-float {
      0%, 100% { transform: translateY(0px) scale(1); filter: drop-shadow(0 0 6px #22c55e); }
      50% { transform: translateY(-8px) scale(1.08); filter: drop-shadow(0 0 12px #4ade80); }
    }
    .sims-plumbob {
      animation: plumbob-float 2s ease-in-out infinite;
      transform-origin: center;
    }

    @keyframes fade-in-up {
      0% { opacity: 0; transform: translateY(8px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .animate-note { animation: fade-in-up 0.3s ease-out forwards; }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }
    .animate-shake { animation: shake 0.4s ease-in-out; }
  </style>

      const [discoveredItems, setDiscoveredItems] = useState(new Set());

      const [errorMsg, setErrorMsg] = useState("");
      const [showHint, setShowHint] = useState(false);
      const [gameWon, setGameWon] = useState(false);

      const room = ROOMS[currentRoomIndex];

      const handleItemClick = (type) => {
        if (type !== 'door') {
          const updated = new Set(discoveredItems);
          updated.add(type);
          setDiscoveredItems(updated);
        }
        setActiveModal(type);
        setErrorMsg("");
        setShowHint(false);
      };

      const handleCloseModal = () => {
        setActiveModal(null);
        setInputCode("");
        setErrorMsg("");
      };

      const handleUnlock = (e) => {
        e.preventDefault();
        const cleaned = inputCode.trim().toUpperCase();
        if (room.door.answers.includes(cleaned)) {
          if (currentRoomIndex < ROOMS.length - 1) {
            // Gå till nästa rum
            setCurrentRoomIndex(prev => prev + 1);
            setDiscoveredItems(new Set());
            setActiveModal(null);
            setInputCode("");
            setErrorMsg("");
          } else {
            setGameWon(true);
          }

          setErrorMsg("Fel kod! Läs ledtrådarna i anteckningsboken noga.");
        }

                        : 'bg-slate-800 text-slate-500 border border-slate-700'

                  <polygon points="180,110 380,150 380,240 180,200" fill="#f8fafc" stroke="#64748b" strokeWidth="4" />
                  <polygon points="185,115 375,153 375,235 185,197" fill="#ffffff" />
                  <line x1="200" y1="140" x2="350" y2="170" stroke="#0284c7" strokeWidth="3" />
                  <line x1="200" y1="160" x2="330" y2="185" stroke="#475569" strokeWidth="2" />

                  {/* Bänk i förgrunden */}
                  <g className="cursor-pointer" onClick={() => handleItemClick('itemB')}>
                    <polygon points="340,320 480,350 440,390 300,360" fill="#d97706" stroke="#92400e" strokeWidth="2" />
                    <line x1="340" y1="320" x2="340" y2="390" stroke="#334155" strokeWidth="4" />
                    <line x1="480" y1="350" x2="480" y2="420" stroke="#334155" strokeWidth="4" />
                    <line x1="440" y1="390" x2="440" y2="450" stroke="#334155" strokeWidth="4" />
                    <line x1="300" y1="360" x2="300" y2="430" stroke="#334155" strokeWidth="4" />
                    {/* Anteckningsbok på bänken */}
                    <polygon points="360,345 400,355 390,370 350,360" fill="#fef08a" stroke="#ca8a04" strokeWidth="1" />
                  </g>
                </g>
              )}

              {/* RUM 2: Korridoren */}
              {room.id === 2 && (
                <g>
                  {/* Rad med skåp på högra väggen */}
                  <polygon points="530,220 700,165 700,320 530,375" fill="#0284c7" stroke="#0369a1" strokeWidth="3" />
                  <line x1="585" y1="202" x2="585" y2="357" stroke="#075985" strokeWidth="2" />
                  <line x1="640" y1="184" x2="640" y2="339" stroke="#075985" strokeWidth="2" />
                  {/* Skåpventilations-galler */}
                  <circle cx="560" cy="245" r="4" fill="#38bdf8" />
                  <circle cx="615" cy="227" r="4" fill="#38bdf8" />
                  <circle cx="670" cy="209" r="4" fill="#38bdf8" />

                  {/* Anslagstavla på vänster vägg */}
                  <polygon points="200,120 360,150 360,230 200,200" fill="#b45309" stroke="#78350f" strokeWidth="5" />
                  <polygon points="208,126 352,153 352,224 208,197" fill="#fde68a" />
                </g>
              )}

              {/* RUM 3: Skolgården */}
              {room.id === 3 && (
                <g>
                  {/* Basketkorg på vänster staket/vägg */}
                  <line x1="220" y1="260" x2="220" y2="120" stroke="#64748b" strokeWidth="8" />
                  <rect x="200" y="100" width="60" height="40" fill="#ffffff" stroke="#ef4444" strokeWidth="3" />
                  <rect x="215" y="115" width="30" height="20" fill="none" stroke="#ef4444" strokeWidth="2" />
                  {/* Korg */}
                  <ellipse cx="230" cy="140" rx="15" ry="6" fill="none" stroke="#f97316" strokeWidth="3" />
                  <path d="M 215 140 L 225 160 L 235 160 L 245 140" fill="none" stroke="#ffffff" strokeWidth="1.5" />

                  {/* Rastbänk */}
                  <polygon points="400,340 560,370 540,400 380,370" fill="#78350f" stroke="#451a03" strokeWidth="2" />
                  <polygon points="400,330 560,360 560,370 400,340" fill="#92400e" />
                </g>
              )}

              {/* RUM 4: Biblioteket */}
              {room.id === 4 && (
                <g>
                  {/* Stor bokhylla på vänstra väggen */}
                  <polygon points="180,100 340,130 340,290 180,260" fill="#451a03" stroke="#270d02" strokeWidth="3" />
                  {/* Hyllplan och böcker */}
                  <polygon points="190,140 330,165 330,175 190,150" fill="#78350f" />
                  <polygon points="190,190 330,215 330,225 190,200" fill="#78350f" />
                  {/* Färgade böcker */}
                  <rect x="210" y="152" width="12" height="30" fill="#dc2626" />
                  <rect x="225" y="155" width="10" height="27" fill="#2563eb" />
                  <rect x="238" y="158" width="14" height="24" fill="#16a34a" />
                  <rect x="260" y="162" width="12" height="28" fill="#eab308" />

                  {/* Studiebord med lampa */}
                  <polygon points="340,300 480,330 440,380 300,350" fill="#78350f" stroke="#451a03" strokeWidth="2" />
                  {/* Bordslampa */}
                  <ellipse cx="380" cy="305" rx="10" ry="5" fill="#ca8a04" />
                  <line x1="380" y1="305" x2="380" y2="280" stroke="#ca8a04" strokeWidth="3" />
                  <polygon points="365,280 395,280 390,265 370,265" fill="#15803d" />
                </g>
              )}

              {/* RUM 5: Datasalen */}
              {room.id === 5 && (
                <g>
                  {/* Datorskrivbord & skärmar */}
                  <polygon points="260,220 460,260 420,320 220,280" fill="#475569" stroke="#1e293b" strokeWidth="3" />
                  {/* Datorskärm 1 */}
                  <polygon points="280,200 330,210 330,240 280,230" fill="#0284c7" stroke="#0f172a" strokeWidth="2" />
                  <line x1="305" y1="235" x2="305" y2="245" stroke="#334155" strokeWidth="4" />
                  {/* Datorskärm 2 */}
                  <polygon points="360,215 410,225 410,255 360,245" fill="#38bdf8" stroke="#0f172a" strokeWidth="2" />
                  <line x1="385" y1="250" x2="385" y2="260" stroke="#334155" strokeWidth="4" />
                </g>
              )}

              {/* RUM 6-10 MÖBELGENERISK DEKOR */}
              {room.id >= 6 && (
                <g>
                  {/* Anslag/dekorationer i varierande stil */}
                  <polygon points="220,120 360,150 360,230 220,200" fill="#334155" stroke="#475569" strokeWidth="3" />
                  {/* Bord eller lounge-möbel */}
                  <polygon points="320,300 480,330 430,390 270,360" fill="#475569" stroke="#1e293b" strokeWidth="2" />
                  <circle cx="370" cy="340" r="15" fill="#64748b" />
                </g>
              )}

              {/* ================= DÖRREN / LÅSET (HÖGRA VÄGGEN) ================= */}
              <g 
                className="cursor-pointer group" 
                onClick={() => handleItemClick('door')}
              >
                {/* Dörrkarm i 2.5D */}
                <polygon points="680,150 800,120 800,320 680,350" fill="#1e293b" stroke="#0f172a" strokeWidth="4" />
                {/* Dörrblad */}
                <polygon points="690,158 790,132 790,314 690,340" fill="#334155" className="group-hover:fill-slate-600 transition-colors" />
                
                {/* Dörrfönster/skylt */}
                <polygon points="710,180 770,165 770,220 710,235" fill="#0284c7" opacity="0.6" stroke="#38bdf8" strokeWidth="1" />

                {/* Stort Hänglås / Kodlås */}
                <rect x="725" y="240" width="30" height="26" rx="4" fill="#eab308" stroke="#ca8a04" strokeWidth="2" />
                <path d="M 732 240 C 732 228, 748 228, 748 240" fill="none" stroke="#cbd5e1" strokeWidth="4" />
                <circle cx="740" cy="253" r="3" fill="#713f12" />

                {/* Skylt ovanför dörren */}
                <rect x="710" y="90" width="60" height="18" rx="3" fill="#dc2626" />
                <text x="740" y="103" fill="#ffffff" fontSize="10" fontWeight="bold" textAnchor="middle">UTGÅNG</text>

                {/* Pulserande lås-indikator */}
                <circle cx="740" cy="253" r="18" fill="#eab308" opacity="0.25" className="animate-ping" />
              </g>

              {/* ================= SIMS PLUMBOB (INTERAKTIVA PUNKTER) ================= */}
              
              {/* Punkt A */}
              <g 
                transform={`translate(${room.items.itemA.pos.x}, ${room.items.itemA.pos.y})`} 
                onClick={() => handleItemClick('itemA')}
                className="cursor-pointer"
              >
                <use href="#plumbob-icon" />
                <text y="35" textAnchor="middle" fill="#ffffff" fontSize="11" fontWeight="bold" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.9))">
                  {room.items.itemA.name}
                </text>
              </g>

              {/* Punkt B */}
              <g 
                transform={`translate(${room.items.itemB.pos.x}, ${room.items.itemB.pos.y})`} 
                onClick={() => handleItemClick('itemB')}
                className="cursor-pointer"
              >
                <use href="#plumbob-icon" />
                <text y="35" textAnchor="middle" fill="#ffffff" fontSize="11" fontWeight="bold" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.9))">
                  {room.items.itemB.name}
                </text>
              </g>

              {/* Dörr etikett */}
              <text x="740" y="380" textAnchor="middle" fill="#facc15" fontSize="13" fontWeight="bold" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.9))">
                Klicka för att låsa upp
              </text>

            </svg>
          </main>

          {/* ================= BOTTENPANEL: ANTECKNINGSBOK & HJÄLP ================= */}
          <footer className="w-full mt-3 grid grid-cols-1 md:grid-cols-3 gap-3">
            
            {/* Anteckningsboken (Tar 2 av 3 kolumner) */}
            <div className="md:col-span-2 bg-[#fdfbf7] text-slate-800 rounded-2xl p-4 shadow-xl border-l-[12px] border-amber-600 relative overflow-hidden flex flex-col justify-between min-h-[140px]">
              <div>
                <div className="flex items-center justify-between border-b border-amber-200 pb-1 mb-2">
                  <h3 className="font-bold text-xs uppercase tracking-wider text-amber-900">
                    Elevens Anteckningsbok – {room.title}
                  </h3>
                  <span className="text-[11px] text-amber-700">Sparar automatiskt</span>
                </div>
                
                <ul className="space-y-1.5 font-handwriting text-xl text-slate-900 leading-snug">
                  {discoveredItems.size === 0 ? (
                    <li className="text-slate-400 italic text-lg list-none pt-2">
                      Klicka på de gröna Sims-diamanterna (Plumbobs) i rummet för att hitta ledtrådar till lösenordet...
                    </li>
                  ) : (
                    Array.from(discoveredItems).map((key) => (
                      <li key={key} className="animate-note flex items-start gap-2">
                        <span className="text-emerald-700 font-bold">✔</span>
                        <span>{room.items[key].note}</span>
                      </li>
                    ))
                  )}
                </ul>
              </div>

              <div className="text-[11px] text-slate-400 pt-2 border-t border-amber-100 flex justify-between">
                <span>Hitta alla ledtrådar för att lista ut koden.</span>
                <span>{discoveredItems.size} av 2 upptäckta</span>
              </div>
            </div>

            {/* Hjälp & Fastnat-panel */}
            <div className="bg-[#172533] rounded-2xl p-4 shadow-xl border border-slate-700 flex flex-col justify-between">
              <div>
                <h3 className="text-sm font-bold text-white mb-1 flex items-center gap-1.5">
                  <span className="text-amber-400">💡</span> Behöver ni hjälp?
                </h3>
                <p className="text-xs text-slate-300 mb-3">
                  Diskutera ledtrådarna i gruppen. Kan ni lista ut vilket ord som öppnar dörren?
                </p>
              </div>

              {showHint ? (
                <div className="p-2.5 bg-amber-500/10 border border-amber-500/30 rounded-xl text-xs text-amber-300">
                  <strong>Tips:</strong> {room.door.hint}
                </div>
              ) : (
                <button 
                  onClick={() => setShowHint(true)}
                  className="w-full py-2.5 bg-slate-800 hover:bg-slate-700 text-amber-300 text-xs font-bold rounded-xl border border-amber-500/30 transition-colors"
                >
                  Visa en ledtråd
                </button>
              )}
            </div>

          </footer>

          {/* ================= POPUP / MODAL ================= */}
          {activeModal && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-[#172533] border-2 border-slate-600 rounded-2xl max-w-md w-full overflow-hidden shadow-2xl animate-note">
                
                {/* Modal Header */}
                <div className="px-5 py-3.5 bg-slate-800/80 border-b border-slate-700 flex justify-between items-center">
                  <h3 className="font-bold text-white text-sm flex items-center gap-2">
                    {activeModal === 'door' ? '🔐 ' + room.door.name : '🔍 ' + room.items[activeModal].title}
                  </h3>
                  <button 
                    onClick={handleCloseModal}
                    className="text-slate-400 hover:text-white text-xs px-2 py-1 bg-slate-700 rounded-md"
                  >
                    Stäng ✕
                  </button>
                </div>

                {/* Modal Innehåll */}
                <div className="p-6">
                  {activeModal !== 'door' ? (
                    <div>
                      <div className="bg-[#fdfbf7] text-slate-800 p-5 rounded-xl mb-5 font-handwriting text-2xl leading-snug shadow-inner border border-amber-200">
                        "{room.items[activeModal].text}"
                      </div>
                      <button 
                        onClick={handleCloseModal}
                        className="w-full py-3 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold rounded-xl transition-all shadow-md"
                      >
                        Skriv in i anteckningsboken
                      </button>
                    </div>
                  ) : (
                    <div>
                      <p className="text-slate-200 text-sm mb-4 leading-relaxed font-medium">
                        {room.door.question}
                      </p>

                      <form onSubmit={handleUnlock} className="space-y-3">
                        <input 
                          type="text" 
                          value={inputCode}
                          onChange={(e) => setInputCode(e.target.value)}
                          placeholder="SKRIV KODEN HÄR..."
                          autoFocus
                          className="w-full py-3 px-4 bg-slate-900 border-2 border-slate-600 focus:border-emerald-500 rounded-xl text-center text-lg font-black text-white tracking-widest uppercase focus:outline-none"
                        />

                        {errorMsg && (
                          <p className="text-xs text-rose-400 font-bold text-center animate-shake">
                            {errorMsg}
                          </p>
                        )}

                        <button 
                          type="submit"
                          className="w-full py-3 bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold text-sm uppercase tracking-wider rounded-xl transition-all shadow-lg"
                        >
                          Lås upp dörren
                        </button>
                      </form>
                    </div>
                  )}
                </div>

              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<SimsSchoolEscape />);
  </script>
</body>
</html>
