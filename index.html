    body { font-family: 'Inter', sans-serif; }
    .font-handwriting { font-family: 'Caveat', cursive; }
    .font-game { font-family: 'Fredoka', cursive, sans-serif; }

    /* Sims Plumbob animation */
    @keyframes plumbob-float {
      0%, 100% { transform: translateY(0px) scale(1); filter: drop-shadow(0 0 6px #22c55e); }
      50% { transform: translateY(-10px) scale(1.1); filter: drop-shadow(0 0 12px #4ade80); }
    }
    .sims-plumbob {
      animation: plumbob-float 2s ease-in-out infinite;
      transform-origin: center;
    }

    /* Animation när man byter rum */
    @keyframes room-transition {
      0% { opacity: 0; transform: scale(0.95) translateY(15px); filter: blur(4px); }
      100% { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
    }
    .animate-room { animation: room-transition 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }

    @keyframes fade-in-up {
      0% { opacity: 0; transform: translateY(8px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .animate-note { animation: fade-in-up 0.3s ease-out forwards; }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }
    .animate-shake { animation: shake 0.4s ease-in-out; }
  </style>

        if (type !== 'door') {
          const updated = new Set(discoveredItems);
          updated.add(type);
          setDiscoveredItems(updated);
        }
        setActiveModal(type);
        setErrorMsg("");
        setShowHint(false);
      };

        setActiveModal(null);
        setInputCode("");
        setErrorMsg("");
      };

        e.preventDefault();
        const cleaned = inputCode.trim().toUpperCase();
        if (room.door.answers.includes(cleaned)) {

            // Gå till nästa rum
            setCurrentRoomIndex(prev => prev + 1);
            setDiscoveredItems(new Set());
            setActiveModal(null);
            setInputCode("");
            setErrorMsg("");
            setShowHint(false);

            setGameWon(true);

            return (
              <g>
                <polygon points="200,260 320,285 280,310 160,285" fill="#10b981" stroke="#047857" strokeWidth="3" />
                <polygon points="180,240 300,265 290,270 170,245" fill="#059669" />
                <polygon points="460,110 520,120 520,170 460,160" fill="#84cc16" />
                <polygon points="350,330 450,350 420,370 320,350" fill="#d97706" />
              </g>
            );
          case 9: // Uppehållsrum
            return (
              <g>
                <polygon points="300,320 500,360 450,410 250,370" fill="#22c55e" stroke="#ffffff" strokeWidth="3" />
                <line x1="375" y1="365" x2="375" y2="345" stroke="#475569" strokeWidth="4" />
                <polygon points="180,120 280,140 280,200 180,180" fill="#facc15" />
                <circle cx="480" cy="240" r="20" fill="#ef4444" />
                <circle cx="440" cy="220" r="25" fill="#3b82f6" />
              </g>
            );
          case 10: // Rektor
            return (
              <g>
                <polygon points="340,240 540,280 480,340 280,300" fill="#78350f" stroke="#451a03" strokeWidth="4" />
                <polygon points="360,220 420,230 400,250 340,240" fill="#1e293b" />
                <polygon points="200,100 260,110 260,160 200,150" fill="#facc15" stroke="#ca8a04" strokeWidth="2" />
                <polygon points="560,120 620,100 620,200 560,220" fill="#334155" />
              </g>
            );
          default:
            return null;
        }
      }

      if (gameWon) {
        return (
          <div className="min-h-screen bg-[#0d161d] flex items-center justify-center p-4">
            <div className="bg-[#172533] border-2 border-emerald-500 rounded-3xl p-8 max-w-xl text-center shadow-2xl">
              <div className="w-20 h-20 mx-auto mb-4">
                <svg viewBox="0 0 100 100" className="w-full h-full sims-plumbob">
                  <polygon points="50,5 85,50 50,95 15,50" fill="#22c55e" stroke="#15803d" strokeWidth="3" />
                  <polygon points="50,5 50,95 15,50" fill="#4ade80" opacity="0.6" />
                </svg>
              </div>
              <h1 className="text-3xl font-extrabold text-emerald-400 mb-3 font-game">UPPDRAG SLUTFÖRT!</h1>
              <p className="text-slate-300 text-lg mb-6 leading-relaxed">
                Ni tog er igenom alla skolans 10 utmaningar och visade hur man bemöter fördomar, visar civilkurage och skapar ett äkta inkluderande <strong>SKOLKLIMAT</strong>!
              </p>
              <button 
                onClick={() => { setCurrentRoomIndex(0); setDiscoveredItems(new Set()); setGameWon(false); }}
                className="px-8 py-3 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold rounded-xl transition-all shadow-lg hover:scale-105"
              >
                Börja om från Rum 1
              </button>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen flex flex-col items-center justify-between p-4 max-w-6xl mx-auto">
          
          {/* HEADER */}
          <header className="w-full mb-3 flex flex-col md:flex-row md:items-center md:justify-between gap-3 bg-[#172533]/80 backdrop-blur p-4 rounded-2xl border border-slate-700/50">
            <div>
              <div className="flex items-center gap-2">
                <span className="px-2.5 py-0.5 rounded-full text-xs font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">
                  RUM {currentRoomIndex + 1} AV {ROOMS.length}
                </span>
                <span className="text-xs text-slate-400">Sims-Edition</span>
              </div>
              <h1 className="text-2xl font-black text-white font-game mt-0.5">{room.title}</h1>
              <p className="text-xs text-slate-300">{room.subtitle}</p>
            </div>

            {/* Rums-tracker */}
            <div className="flex items-center gap-1.5 overflow-x-auto py-1">
              {ROOMS.map((r, idx) => (
                <div 
                  key={r.id} 
                  className={`w-7 h-7 rounded-lg flex items-center justify-center text-xs font-bold transition-all ${
                    idx === currentRoomIndex 
                      ? 'bg-emerald-500 text-slate-950 scale-110 shadow-md shadow-emerald-500/30 font-black ring-2 ring-emerald-300' 
                      : idx < currentRoomIndex 
                        ? 'bg-emerald-900/60 text-emerald-300 border border-emerald-700/50' 
                        : 'bg-slate-800 text-slate-500 border border-slate-700'
                  }`}
                >
                  {idx + 1}
                </div>
              ))}
            </div>
          </header>

          {/* ================= DEN ISOMETRISKA SCENEN ================= */}
          <main className="w-full relative aspect-[16/9] max-h-[520px] bg-[#0c141a] rounded-3xl overflow-hidden border-4 border-slate-800 shadow-2xl">
            
            {/* Animeringstagg som triggas om varje gång rummet byts */}
            <div key={currentRoomIndex} className="w-full h-full animate-room">
              <svg viewBox="0 0 1000 560" className="w-full h-full select-none">
                <defs>
                  {/* Sims Plumbob Symbol */}
                  <g id="plumbob-icon" className="sims-plumbob cursor-pointer">
                    <polygon points="0,-22 12,0 0,22 -12,0" fill="#22c55e" stroke="#15803d" strokeWidth="2" />
                    <polygon points="0,-22 0,22 -12,0" fill="#4ade80" opacity="0.6" />
                    <polygon points="0,-22 12,0 0,22" fill="#86efac" opacity="0.2" />
                  </g>

                  <linearGradient id="wallLGrad" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stopColor={room.themeColor.wallL} stopOpacity="0.95" />
                    <stop offset="100%" stopColor={room.themeColor.wallL} stopOpacity="0.75" />
                  </linearGradient>

                  <linearGradient id="wallRGrad" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stopColor={room.themeColor.wallR} stopOpacity="0.95" />
                    <stop offset="100%" stopColor={room.themeColor.wallR} stopOpacity="0.75" />
                  </linearGradient>

                  <pattern id="floorTiles" width="40" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(0)">
                    <path d="M 0 10 L 20 0 L 40 10 L 20 20 Z" fill="none" stroke="rgba(0,0,0,0.06)" strokeWidth="1" />
                  </pattern>
                </defs>

                {/* BAS-RUMMET */}
                <polygon points="120,60 500,140 500,380 120,300" fill="url(#wallLGrad)" stroke="#1e293b" strokeWidth="3" />
                <polygon points="500,140 880,60 880,300 500,380" fill="url(#wallRGrad)" stroke="#1e293b" strokeWidth="3" />
                <polygon points="120,300 500,380 880,300 500,520" fill={room.themeColor.floor} stroke="#1e293b" strokeWidth="4" />
                <polygon points="120,300 500,380 880,300 500,520" fill="url(#floorTiles)" />
                <polyline points="120,300 500,380 880,300" fill="none" stroke="#0f172a" strokeWidth="6" opacity="0.4" />

                {/* UNIK MÖBLERING FÖR VARJE RUM */}
                {renderRoomDecor(room.id)}

                {/* ================= DÖRREN / LÅSET ================= */}
                <g className="cursor-pointer group" onClick={() => handleItemClick('door')}>
                  <polygon points="680,150 800,120 800,320 680,350" fill="#1e293b" stroke="#0f172a" strokeWidth="4" />
                  <polygon points="690,158 790,132 790,314 690,340" fill={room.themeColor.door} className="opacity-90 hover:opacity-100 transition-opacity" />
                  <polygon points="710,180 770,165 770,220 710,235" fill="#f8fafc" opacity="0.3" />

                  <rect x="725" y="240" width="30" height="26" rx="4" fill="#eab308" stroke="#ca8a04" strokeWidth="2" />
                  <path d="M 732 240 C 732 228, 748 228, 748 240" fill="none" stroke="#cbd5e1" strokeWidth="4" />
                  
                  <rect x="710" y="90" width="60" height="18" rx="3" fill="#dc2626" />
                  <text x="740" y="103" fill="#ffffff" fontSize="10" fontWeight="bold" textAnchor="middle">UTGÅNG</text>

                  <circle cx="740" cy="253" r="18" fill="#eab308" opacity="0.25" className="animate-ping" />
                </g>

                {/* ================= PLUMBOBS (INTERAKTIVA PUNKTER) ================= */}
                <g 
                  transform={`translate(${room.items.itemA.pos.x}, ${room.items.itemA.pos.y})`} 
                  onClick={() => handleItemClick('itemA')}
                  className="cursor-pointer group"
                >
                  <use href="#plumbob-icon" />
                  <text y="35" textAnchor="middle" fill="#ffffff" fontSize="13" fontWeight="bold" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.9))" className="opacity-0 group-hover:opacity-100 transition-opacity">
                    Klicka
                  </text>
                </g>

                <g 
                  transform={`translate(${room.items.itemB.pos.x}, ${room.items.itemB.pos.y})`} 
                  onClick={() => handleItemClick('itemB')}
                  className="cursor-pointer group"
                >
                  <use href="#plumbob-icon" />
                  <text y="35" textAnchor="middle" fill="#ffffff" fontSize="13" fontWeight="bold" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.9))" className="opacity-0 group-hover:opacity-100 transition-opacity">
                    Klicka
                  </text>
                </g>

              </svg>
            </div>
          </main>

          {/* ================= BOTTENPANEL ================= */}
          <footer className="w-full mt-3 grid grid-cols-1 md:grid-cols-3 gap-3">
            <div className="md:col-span-2 bg-[#fdfbf7] text-slate-800 rounded-2xl p-4 shadow-xl border-l-[12px] border-amber-600 relative overflow-hidden flex flex-col justify-between min-h-[140px]">
              <div>
                <div className="flex items-center justify-between border-b border-amber-200 pb-1 mb-2">
                  <h3 className="font-bold text-xs uppercase tracking-wider text-amber-900">Elevens Anteckningsbok</h3>
                  <span className="text-[11px] text-amber-700">Sparar automatiskt</span>
                </div>
                
                <ul className="space-y-1.5 font-handwriting text-xl text-slate-900 leading-snug">
                  {discoveredItems.size === 0 ? (
                    <li className="text-slate-400 italic text-lg list-none pt-2">
                      Klicka på de gröna Sims-diamanterna (Plumbobs) i rummet för att hitta ledtrådar...
                    </li>
                  ) : (
                    Array.from(discoveredItems).map((key) => (
                      <li key={key} className="animate-note flex items-start gap-2">
                        <span className="text-emerald-700 font-bold">✔</span>
                        <span>{room.items[key].note}</span>
                      </li>
                    ))
                  )}
                </ul>
              </div>
            </div>

            <div className="bg-[#172533] rounded-2xl p-4 shadow-xl border border-slate-700 flex flex-col justify-between">
              <div>
                <h3 className="text-sm font-bold text-white mb-1 flex items-center gap-1.5">
                  <span className="text-amber-400">💡</span> Behöver ni hjälp?
                </h3>
                <p className="text-xs text-slate-300 mb-3">
                  Diskutera ledtrådarna i gruppen. Kan ni lista ut vilket ord som öppnar dörren?
                </p>
              </div>

              {showHint ? (
                <div className="p-2.5 bg-amber-500/10 border border-amber-500/30 rounded-xl text-xs text-amber-300">
                  <strong>Tips:</strong> {room.door.hint}
                </div>
              ) : (
                <button 
                  onClick={() => setShowHint(true)}
                  className="w-full py-2.5 bg-slate-800 hover:bg-slate-700 text-amber-300 text-xs font-bold rounded-xl border border-amber-500/30 transition-colors"
                >
                  Visa en ledtråd
                </button>
              )}
            </div>
          </footer>

          {/* ================= POPUP ================= */}
          {activeModal && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-[#172533] border-2 border-slate-600 rounded-2xl max-w-md w-full overflow-hidden shadow-2xl animate-note">
                <div className="px-5 py-3.5 bg-slate-800/80 border-b border-slate-700 flex justify-between items-center">
                  <h3 className="font-bold text-white text-sm flex items-center gap-2">
                    {activeModal === 'door' ? '🔐 ' + room.door.name : '🔍 ' + room.items[activeModal].title}
                  </h3>
                  <button onClick={handleCloseModal} className="text-slate-400 hover:text-white text-xs px-2 py-1 bg-slate-700 rounded-md">Stäng ✕</button>
                </div>
                <div className="p-6">
                  {activeModal !== 'door' ? (
                    <div>
                      <div className="bg-[#fdfbf7] text-slate-800 p-5 rounded-xl mb-5 font-handwriting text-2xl leading-snug shadow-inner border border-amber-200">
                        "{room.items[activeModal].text}"
                      </div>
                      <button onClick={handleCloseModal} className="w-full py-3 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold rounded-xl transition-all shadow-md">
                        Skriv in i anteckningsboken
                      </button>
                    </div>
                  ) : (
                    <div>
                      <p className="text-slate-200 text-sm mb-4 leading-relaxed font-medium">{room.door.question}</p>
                      <form onSubmit={handleUnlock} className="space-y-3">
                        <input 
                          type="text" 
                          value={inputCode}
                          onChange={(e) => setInputCode(e.target.value)}
                          placeholder="SKRIV KODEN HÄR..."
                          autoFocus
                          className="w-full py-3 px-4 bg-slate-900 border-2 border-slate-600 focus:border-emerald-500 rounded-xl text-center text-lg font-black text-white tracking-widest uppercase focus:outline-none"
                        />
                        {errorMsg && <p className="text-xs text-rose-400 font-bold text-center animate-shake">{errorMsg}</p>}
                        <button type="submit" className="w-full py-3 bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold text-sm uppercase tracking-wider rounded-xl transition-all shadow-lg">
                          Lås upp dörren
                        </button>
                      </form>
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<SimsSchoolEscape />);
  </script>
</body>
</html>
