    function EscapeRoomApp() {
      const [currentRoomIndex, setCurrentRoomIndex] = useState(0);
      const [inventory, setInventory] = useState(new Set());
      const [clueRead, setClueRead] = useState(false);
      const [puzzleSolved, setPuzzleSolved] = useState(false);
      const [hiddenObjectFound, setHiddenObjectFound] = useState(false);
      const [activeModal, setActiveModal] = useState(null); // 'clue', 'puzzle', 'doorLock', 'blocked', 'hiddenObj'
      const [blockedMessage, setBlockedMessage] = useState("");
      
      const [reorderList, setReorderList] = useState([]);
      const [categorizedItems, setCategorizedItems] = useState({});
      const [selectedOptions, setSelectedOptions] = useState(new Set());
      const [doorInputCode, setDoorInputCode] = useState("");
      const [tumblerValues, setTumblerValues] = useState(["A", "A", "A", "A"]);
      const [isPadlockTurning, setIsPadlockTurning] = useState(false);
      
      const [errorMsg, setErrorMsg] = useState("");
      const [gameWon, setGameWon] = useState(false);

      const room = ROOMS[currentRoomIndex];

      const initRoom = (idx) => {
        const r = ROOMS[idx];
        setClueRead(false);
        setPuzzleSolved(false);
        setHiddenObjectFound(false);
        setActiveModal(null);
        setErrorMsg("");
        setDoorInputCode("");
        setTumblerValues(["S", "A", "F", "E"]); // Default for tumbler
        setIsPadlockTurning(false);

        if (r.puzzle.type === "reorder") {
          setReorderList([...r.puzzle.initial]);
        } else if (r.puzzle.type === "categorize") {
          const initCats = {};
          r.puzzle.items.forEach(it => initCats[it.id] = r.puzzle.categories[0]);
          setCategorizedItems(initCats);
        } else if (r.puzzle.type === "multiSelect") {
          setSelectedOptions(new Set());
        }
      };

      useEffect(() => {
        initRoom(0);
      }, []);

      const handleTryOpenPuzzle = () => {
        if (!clueRead) {
          setBlockedMessage("Låst! Du måste undersöka och läsa ledtråden i rummet först för att förstå hur detta ska lösas.");
          setActiveModal('blocked');
          return;
        }
        setActiveModal('puzzle');
        setErrorMsg("");
      };

      const handleTryOpenDoor = () => {
        if (!puzzleSolved) {
          setBlockedMessage("Dörren är reglad! Du måste lösa pusslet i rummet och hitta koden/nyckeln först.");
          setActiveModal('blocked');
          return;
        }
        setActiveModal('doorLock');
        setErrorMsg("");
      };

      // --- PUSSELLOGIK ---
      const handleMoveItem = (index, delta) => {
        const target = index + delta;
        if (target < 0 || target >= reorderList.length) return;
        const copy = [...reorderList];
        const temp = copy[index];
        copy[index] = copy[target];
        copy[target] = temp;
        setReorderList(copy);
      };

      const checkReorder = () => {
        const ids = reorderList.map(i => i.id);
        if (ids.every((val, i) => val === room.puzzle.correct[i])) solvePuzzle();
        else setErrorMsg("Ordningsföljden är inte helt rätt. Läs ledtråden noga!");
      };

      const cycleCategory = (itemId) => {
        const cur = categorizedItems[itemId];
        const cats = room.puzzle.categories;
        const next = cats[(cats.indexOf(cur) + 1) % cats.length];
        setCategorizedItems(prev => ({ ...prev, [itemId]: next }));
      };

      const checkCategorize = () => {
        if (room.puzzle.items.every(it => categorizedItems[it.id] === it.correct)) solvePuzzle();
        else setErrorMsg("Något ligger i fel fack. Tänk efter en gång till!");
      };

      const toggleMultiSelect = (id) => {
        const next = new Set(selectedOptions);
        if (next.has(id)) next.delete(id);
        else if (next.size < room.puzzle.requiredCount) next.add(id);
        setSelectedOptions(next);
      };

      const checkMultiSelect = () => {
        if (selectedOptions.size !== room.puzzle.requiredCount) {
          setErrorMsg(`Du måste välja exakt ${room.puzzle.requiredCount} alternativ.`);
          return;
        }
        if (room.puzzle.options.filter(o => o.correct).every(o => selectedOptions.has(o.id))) solvePuzzle();
        else setErrorMsg("Dina val stämmer inte med analysen i boken.");
      };

      const solvePuzzle = () => {
        setPuzzleSolved(true);
        setErrorMsg("");
        if (!room.hasHiddenObject && room.doorType === "padlock") {
          setInventory(prev => new Set(prev).add(room.keyItem));
        }
      };

      // --- GÖMDA FÖREMÅL LOKIK ---
      const handleHiddenObjectClick = () => {
        if (puzzleSolved && room.hasHiddenObject && !hiddenObjectFound) {
          setHiddenObjectFound(true);
          setInventory(prev => new Set(prev).add(room.keyItem));
          setActiveModal('hiddenObj');
        }
      };

      // --- DÖRRLÅS LOGIK ---
      const handleDoorAction = (e) => {
        if (e) e.preventDefault();
        
        if (room.doorType === "padlock") {
          if (inventory.has(room.keyItem)) {
            setIsPadlockTurning(true);
            setTimeout(() => advanceRoom(), 700);
          } else {
            setErrorMsg(`Låst! Du saknar ${room.keyItem}.`);
          }
        } else if (room.doorType === "keypad") {
          if (doorInputCode.trim() === room.doorCode) advanceRoom();
          else setErrorMsg("FEL KOD! Titta noga i rummet och lös gåtan.");
        } else if (room.doorType === "tumbler") {
          if (tumblerValues.join("") === room.doorCode) advanceRoom();
          else setErrorMsg("FEL KOD! Mässingshjulen sitter fast.");
        }
      };

      const cycleTumbler = (idx) => {
        const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        const curChar = tumblerValues[idx];
        const nextChar = alphabet[(alphabet.indexOf(curChar) + 1) % alphabet.length];
        const copy = [...tumblerValues];
        copy[idx] = nextChar;
        setTumblerValues(copy);
      };

      const handleKeypadPress = (val) => {
        if (doorInputCode.length < 4) setDoorInputCode(prev => prev + val);
      };

      const advanceRoom = () => {
        if (currentRoomIndex < ROOMS.length - 1) {
          setCurrentRoomIndex(prev => prev + 1);
          initRoom(currentRoomIndex + 1);
        } else {
          setGameWon(true);

                </g>

                {/* Skrivbord (Pussel) */}
                <g className="interactive-item" onClick={handleTryOpenPuzzle}>
                  <rect x="340" y="240" width="250" height="90" fill="#78350f" stroke="#451a03" strokeWidth="6" rx="4" filter="url(#shadow)" />
                  <rect x="370" y="330" width="18" height="80" fill="#291404" />
                  <rect x="542" y="330" width="18" height="80" fill="#291404" />
                  <rect x="420" y="225" width="60" height="15" fill="#ffffff" rx="2" transform="rotate(-5 450 230)" />
                </g>

                {/* Grön bankirlampa (Gömt föremål = Guldnyckeln) */}
                <g onClick={handleHiddenObjectClick} className={puzzleSolved && !hiddenObjectFound ? "interactive-item" : ""} transform="translate(480, 180)">
                  <rect x="15" y="20" width="45" height="16" fill="#15803d" rx="4" filter="url(#shadow)" />
                  <line x1="37" y1="36" x2="37" y2="60" stroke="#ca8a04" strokeWidth="4" />
                  <ellipse cx="37" cy="60" rx="12" ry="4" fill="#ca8a04" />
                  <polygon points="25,60 50,60 43,30 32,30" fill="#fef08a" opacity="0.2" />
                </g>
              </g>
            );

          default: return null;
        }
      };

      return (
        <div className="w-full max-w-5xl mx-auto flex flex-col justify-between">
          
          {/* HEADER (Karta och status) */}
          <header className="w-full mb-3 flex flex-col md:flex-row md:items-center md:justify-between gap-4 bg-[#091b15] p-5 rounded-2xl border border-[#163a2d] shadow-lg">
            <div>
              <div className="flex items-center gap-3 mb-1">
                <span className="px-3 py-1 rounded-full text-[11px] font-black bg-amber-400/20 text-amber-300 border border-amber-400/40 uppercase tracking-widest">
                  RUM {currentRoomIndex + 1} AV {ROOMS.length}
                </span>
                <span className="text-[11px] font-semibold text-slate-400 tracking-wider">OLWEUS & HATELESS</span>
              </div>
              <h1 className="text-2xl md:text-3xl font-black text-white">{room.title}</h1>
              <p className="text-xs text-slate-300 font-medium">{room.subtitle}</p>
            </div>

            <div className="flex items-center gap-1.5 flex-wrap">
              {ROOMS.map((r, idx) => (
                <div 
                  key={r.id} 
                  className={`w-7 h-7 rounded-lg flex items-center justify-center text-xs font-bold transition-all ${
                    idx === currentRoomIndex 
                      ? 'bg-amber-400 text-slate-950 scale-110 font-black ring-2 ring-amber-200 shadow-md' 
                      : idx < currentRoomIndex 
                        ? 'bg-emerald-700/60 text-emerald-200 border border-emerald-600/50' 
                        : 'bg-[#102a20] text-[#1f503d] border border-[#163a2d]'
                  }`}
                >
                  {idx + 1}
                </div>
              ))}
            </div>
          </header>

          {/* ================= SVG-RUMMET ================= */}
          <main className="w-full relative aspect-[16/10] max-h-[500px] bg-[#07130e] rounded-3xl overflow-hidden border-[5px] border-[#102a20] shadow-2xl">
            <div key={currentRoomIndex} className="w-full h-full animate-room-change">
              <svg viewBox="0 0 800 500" className="w-full h-full select-none">
                {renderRoomIllustration(room.id)}

                {/* DÖRREN LÄNGST TILL HÖGER */}
                <g className="interactive-item" onClick={handleTryOpenDoor} transform="translate(650, 70)">
                  <rect x="0" y="0" width="120" height="290" fill="#0f172a" stroke="#1e293b" strokeWidth="6" rx="4" filter="url(#shadow)" />
                  <rect x="10" y="10" width="100" height="270" fill={puzzleSolved && (!room.hasHiddenObject || hiddenObjectFound) ? "#15803d" : "#991b1b"} className="transition-colors" />
                  
                  <rect x="20" y="20" width="80" height="22" fill="#dc2626" rx="3" />
                  <text x="60" y="34" fill="#ffffff" fontSize="10" fontWeight="black" textAnchor="middle">{room.doorLabel}</text>
                  
                  {room.doorType === "padlock" && (
                    <g transform="translate(45, 120)">
                      <rect x="0" y="15" width="30" height="25" fill="#facc15" stroke="#b45309" strokeWidth="2" rx="4" />
                      <path d="M 7 15 C 7 5, 23 5, 23 15" fill="none" stroke="#e2e8f0" strokeWidth="4" />
                      <circle cx="15" cy="27" r="3" fill="#78350f" />
                    </g>
                  )}

                  {room.doorType === "keypad" && (
                    <g transform="translate(45, 110)">
                      <rect x="0" y="0" width="30" height="42" fill="#1e293b" stroke="#64748b" strokeWidth="2" rx="3" />
                      <rect x="4" y="4" width="22" height="10" fill="#0284c7" />
                      <circle cx="8" cy="22" r="2" fill="#94a3b8" />
                      <circle cx="15" cy="22" r="2" fill="#94a3b8" />
                      <circle cx="22" cy="22" r="2" fill="#94a3b8" />
                    </g>
                  )}

                  {room.doorType === "tumbler" && (
                    <g transform="translate(40, 120)">
                      <rect x="0" y="0" width="40" height="25" fill="#ca8a04" stroke="#713f12" strokeWidth="2" rx="3" />
                      <line x1="10" y1="0" x2="10" y2="25" stroke="#713f12" strokeWidth="1" />
                      <line x1="20" y1="0" x2="20" y2="25" stroke="#713f12" strokeWidth="1" />
                      <line x1="30" y1="0" x2="30" y2="25" stroke="#713f12" strokeWidth="1" />
                    </g>
                  )}

                  <rect x="15" y="250" width="90" height="20" fill={puzzleSolved && (!room.hasHiddenObject || hiddenObjectFound) ? "#22c55e" : "#450a0a"} rx="2" />
                  <text x="60" y="263" fill="#ffffff" fontSize="8" fontWeight="bold" textAnchor="middle">
                    {puzzleSolved && (!room.hasHiddenObject || hiddenObjectFound) ? "LÅS UPP HÄR" : "LÅST"}
                  </text>
                </g>
              </svg>
            </div>
          </main>

          {/* ================= BOTTENPANEL (STATUS & FICKA) ================= */}
          <footer className="w-full mt-3 bg-[#0d221b] border border-[#194435] rounded-2xl p-4 flex flex-col md:flex-row items-center justify-between gap-4 shadow-xl">
            
            {/* Vänster: Status och Steg */}
            <div className="flex items-center gap-4 flex-1">
              <div className="w-12 h-12 rounded-full bg-[#15392d] border border-[#225b48] flex items-center justify-center font-bold text-lg text-amber-400">
                {!clueRead ? "1" : !puzzleSolved ? "2" : (!room.hasHiddenObject || hiddenObjectFound) ? "🔑" : "3"}
              </div>
              <div>
                <span className="text-[10px] uppercase font-bold text-slate-400 tracking-widest block mb-0.5">Aktuellt steg</span>
                <p className="text-sm font-bold text-white">
                  {!clueRead 
                    ? `Undersök ${room.cluePrompt} i rummet` 
                    : !puzzleSolved 
                      ? `Lös pusslet vid ${room.puzzlePrompt}` 
                      : (!room.hasHiddenObject || hiddenObjectFound)
                        ? `Gå till ${room.doorLabel} och öppna dörren!`
                        : `Leta i rummet efter den gömda ${room.keyItem}`}
                </p>
              </div>
            </div>

            {/* Mitten: Föremål/Ryggsäck */}
            <div className="flex items-center gap-3 bg-[#06120e] px-5 py-3 rounded-xl border border-[#123126]">
              <span className="text-[10px] font-black text-slate-500 uppercase tracking-widest">Ficka:</span>
              {inventory.size === 0 ? (
                <span className="text-xs text-slate-600 italic font-medium">Tom</span>
              ) : (
                <div className="flex gap-2">
                  {Array.from(inventory).map(item => (
                    <span key={item} className="text-[11px] font-black bg-amber-400 text-slate-950 px-2.5 py-1 rounded shadow-md">
                      🔑 {item}
                    </span>
                  ))}
                </div>
              )}
            </div>

            {/* Höger: Manuella knappar (frivilligt stöd) */}
            <div className="flex gap-2">
              <button 
                onClick={() => { setClueRead(true); setActiveModal('clue'); }}
                className="px-4 py-2.5 bg-[#15392d] hover:bg-[#1d4d3d] text-slate-200 text-xs font-bold rounded-xl border border-[#225b48] transition-colors flex items-center gap-2"
              >
                📖 Ledtråd
              </button>
              <button 
                onClick={handleTryOpenPuzzle}
                className={`px-4 py-2.5 text-xs font-bold rounded-xl transition-colors flex items-center gap-2 ${clueRead ? 'bg-indigo-600 hover:bg-indigo-500 text-white' : 'bg-slate-800 text-slate-500 border border-slate-700'}`}
              >
                ⚙️ Pussel
              </button>
              <button 
                onClick={handleTryOpenDoor}
                className={`px-4 py-2.5 text-xs font-bold rounded-xl transition-colors flex items-center gap-2 ${puzzleSolved && (!room.hasHiddenObject || hiddenObjectFound) ? 'bg-amber-400 hover:bg-amber-300 text-slate-900' : 'bg-slate-800 text-slate-500 border border-slate-700'}`}
              >
                🔐 Lås
              </button>
            </div>
          </footer>

          {/* ================= MODALER ================= */}
          {activeModal && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-[#0b1d16] border-2 border-[#194435] rounded-3xl max-w-lg w-full overflow-hidden shadow-2xl animate-room-change">
                
                {/* Header */}
                <div className="px-6 py-4 bg-[#07130e] border-b border-[#194435] flex justify-between items-center">
                  <h3 className="font-bold text-white text-sm flex items-center gap-2 tracking-wide uppercase">
                    {activeModal === 'clue' && '🔍 ' + room.clue.title}
                    {activeModal === 'puzzle' && '⚙️ ' + room.puzzle.title}
                    {activeModal === 'doorLock' && '🔐 ' + room.doorLabel}
                    {activeModal === 'blocked' && '🔒 Åtkomst nekad'}
                    {activeModal === 'hiddenObj' && '🎉 Nyckel funnen'}
                  </h3>
                  <button onClick={() => setActiveModal(null)} className="text-slate-400 hover:text-white text-xs px-3 py-1.5 bg-white/5 hover:bg-white/10 rounded-lg transition-colors font-bold">
                    Stäng X
                  </button>
                </div>

                <div className="p-6 max-h-[75vh] overflow-y-auto">
                  
                  {activeModal === 'blocked' && (
                    <div className="text-center py-4">
                      <div className="w-16 h-16 bg-rose-500/10 text-rose-500 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl border border-rose-500/30">
                        🔒
                      </div>
                      <p className="text-slate-300 text-sm leading-relaxed mb-6 font-medium">
                        {blockedMessage}
                      </p>
                      <button 
                        onClick={() => setActiveModal(null)}
                        className="w-full py-3.5 bg-slate-800 hover:bg-slate-700 text-white font-bold rounded-xl transition-all text-xs uppercase tracking-wider"
                      >
                        Tillbaka till rummet
                      </button>
                    </div>
                  )}

                  {activeModal === 'hiddenObj' && (
                    <div className="text-center py-4">
                      <div className="w-16 h-16 bg-amber-400/20 text-amber-400 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl border border-amber-400/40 animate-unlock">
                        🔑
                      </div>
                      <p className="text-amber-300 font-bold text-base mb-6">
                        {room.hiddenObjectReward}
                      </p>
                      <button 
                        onClick={() => setActiveModal(null)}
                        className="w-full py-3.5 bg-amber-400 hover:bg-amber-300 text-slate-900 font-black rounded-xl transition-all shadow-lg text-xs uppercase tracking-wider"
                      >
                        Grymt! Lås upp dörren nu ➔
                      </button>
                    </div>
                  )}

                  {activeModal === 'clue' && (
                    <div>
                      <div className="relative bg-[#fcf8f2] text-slate-800 p-6 rounded-2xl shadow-lg border border-amber-200 mb-6">
                        <div className="absolute -top-3 left-1/2 -translate-x-1/2 w-6 h-6 bg-red-600 rounded-full border-2 border-red-800 shadow-md"></div>
                        <p className="font-handwriting text-2xl leading-relaxed text-slate-900 pt-3 text-center">
                          "{room.clue.text}"
                        </p>
                      </div>
                      <button 
                        onClick={() => setActiveModal(null)}
                        className="w-full py-3.5 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl transition-all shadow-md uppercase tracking-wider text-xs"
                      >
                        Jag har förstått
                      </button>
                    </div>
                  )}

                  {activeModal === 'puzzle' && (
                    <div>
                      {!puzzleSolved ? (
                        <div>
                          <p className="text-[11px] text-indigo-300 font-bold uppercase tracking-widest mb-4 text-center">
                            {room.puzzle.instruction}
                          </p>

                          {/* REORDER PUSSEL */}
                          {room.puzzle.type === "reorder" && (
                            <div className="space-y-2.5 mb-5">
                              {reorderList.map((it, idx) => (
                                <div key={it.id} className="bg-[#0b1d16] border border-[#163a2d] p-3.5 rounded-xl flex items-center justify-between gap-3 text-xs shadow-inner">
                                  <span className="font-semibold text-slate-200 leading-relaxed">{it.text}</span>
                                  <div className="flex flex-col gap-1 shrink-0">
                                    <button 
                                      disabled={idx === 0}
                                      onClick={() => handleMoveItem(idx, -1)}
                                      className="px-2.5 py-1 bg-[#1a4233] hover:bg-indigo-500 text-slate-300 hover:text-white disabled:opacity-30 rounded font-bold transition-colors"
                                    >▲</button>
                                    <button 
                                      disabled={idx === reorderList.length - 1}
                                      onClick={() => handleMoveItem(idx, 1)}
                                      className="px-2.5 py-1 bg-[#1a4233] hover:bg-indigo-500 text-slate-300 hover:text-white disabled:opacity-30 rounded font-bold transition-colors"
                                    >▼</button>
                                  </div>
                                </div>
                              ))}
                              <button onClick={checkReorder} className="w-full py-3.5 bg-indigo-600 hover:bg-indigo-500 text-white font-black text-xs uppercase tracking-widest rounded-xl transition-all shadow-lg mt-2">
                                Kontrollera ordning
                              </button>
                            </div>
                          )}

                          {/* CATEGORIZE PUSSEL */}
                          {room.puzzle.type === "categorize" && (
                            <div className="space-y-3 mb-5">
                              {room.puzzle.items.map(it => (
                                <div key={it.id} className="bg-[#0b1d16] border border-[#163a2d] p-3.5 rounded-xl text-xs flex flex-col sm:flex-row sm:items-center justify-between gap-3 shadow-inner">
                                  <span className="font-semibold text-slate-200 leading-relaxed">{it.text}</span>
                                  <button
                                    onClick={() => cycleCategory(it.id)}
                                    className="px-3 py-2 bg-[#1a4233] hover:bg-indigo-500 text-indigo-300 hover:text-white font-bold rounded-lg border border-[#225b48] transition-colors self-end sm:self-auto shrink-0"
                                  >
                                    {categorizedItems[it.id]} ⇄
                                  </button>
                                </div>
                              ))}
                              <button onClick={checkCategorize} className="w-full py-3.5 bg-indigo-600 hover:bg-indigo-500 text-white font-black text-xs uppercase tracking-widest rounded-xl transition-all shadow-lg mt-2">
                                Kontrollera facken
                              </button>
                            </div>
                          )}

                          {/* MULTISELECT PUSSEL */}
                          {room.puzzle.type === "multiSelect" && (
                            <div className="space-y-2.5 mb-5">
                              {room.puzzle.options.map(opt => {
                                const isSel = selectedOptions.has(opt.id);
                                return (
                                  <button
                                    key={opt.id}
                                    onClick={() => toggleMultiSelect(opt.id)}
                                    className={`w-full text-left p-3.5 rounded-xl border text-xs font-semibold leading-relaxed transition-all flex items-start gap-3 shadow-inner ${
                                      isSel
                                        ? 'bg-indigo-500/20 border-indigo-500 text-indigo-200'
                                        : 'bg-[#0b1d16] hover:bg-[#123126] border-[#163a2d] text-slate-300'
                                    }`}
                                  >
                                    <span className={`w-4 h-4 rounded border flex items-center justify-center shrink-0 mt-0.5 transition-colors ${isSel ? 'bg-indigo-500 text-white border-indigo-500' : 'border-slate-500'}`}>
                                      {isSel ? '✓' : ''}
                                    </span>
                                    <span>{opt.text}</span>
                                  </button>
                                );
                              })}
                              <button onClick={checkMultiSelect} className="w-full py-3.5 bg-indigo-600 hover:bg-indigo-500 text-white font-black text-xs uppercase tracking-widest rounded-xl transition-all shadow-lg mt-2">
                                Kontrollera valda ({selectedOptions.size} / {room.puzzle.requiredCount})
                              </button>
                            </div>
                          )}

                          {errorMsg && <p className="text-[11px] text-rose-400 font-bold text-center mt-3 uppercase tracking-widest animate-shake">{errorMsg}</p>}
                        </div>
                      ) : (
                        <div className="text-center py-4">
                          <div className="w-16 h-16 bg-emerald-500/20 text-emerald-400 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl border border-emerald-500/40 animate-unlock">
                            ✓
                          </div>
                          <p className="text-emerald-300 font-bold text-sm mb-6 leading-relaxed">
                            {room.puzzle.rewardText}
                          </p>
                          <button 
                            onClick={() => setActiveModal(null)}
                            className="w-full py-3.5 bg-slate-800 hover:bg-slate-700 text-white font-black text-xs uppercase tracking-wider rounded-xl transition-all shadow-lg"
                          >
                            Fortsätt leta i rummet ➔
                          </button>
                        </div>
                      )}
                    </div>
                  )}

                  {/* MODAL 3: DÖRREN / LÅSET */}
                  {activeModal === 'doorLock' && (
                    <div className="text-center">
                      
                      {room.doorType === "padlock" && (
                        <div>
                          <div className="w-28 h-36 mx-auto mb-6 relative">
                            <svg viewBox="0 0 100 120" className={`w-full h-full ${isPadlockTurning ? 'animate-unlock' : ''}`}>
                              <path d={isPadlockTurning ? "M 30 45 C 30 15, 70 15, 70 30" : "M 30 45 C 30 15, 70 15, 70 45"} fill="none" stroke="#94a3b8" strokeWidth="12" strokeLinecap="round" />
                              <rect x="15" y="45" width="70" height="65" fill="#facc15" stroke="#b45309" strokeWidth="4" rx="10" />
                              <circle cx="50" cy="72" r="8" fill="#713f12" />
                              <polygon points="46,72 54,72 52,90 48,90" fill="#713f12" />
                            </svg>
                          </div>
                          <p className="text-slate-300 text-sm font-medium mb-5">
                            Detta lås kräver nyckeln <strong className="text-amber-400">{room.keyItem}</strong>.
                          </p>
                          {inventory.has(room.keyItem) ? (
                            <button onClick={handleTurnKeyInPadlock} disabled={isPadlockTurning} className="w-full py-4 bg-amber-400 hover:bg-amber-300 text-slate-900 font-black text-xs uppercase tracking-widest rounded-xl transition-all shadow-lg">
                              {isPadlockTurning ? "Låser upp..." : `🔑 Sätt i ${room.keyItem}`}
                            </button>
                          ) : (
                            <div className="bg-rose-500/10 border border-rose-500/30 p-4 rounded-xl text-rose-400 text-xs font-bold uppercase tracking-widest mb-3">
                              Nyckeln saknas!
                            </div>
                          )}
                        </div>
                      )}

                      {room.doorType === "keypad" && (
                        <div>
                          <p className="text-xs text-slate-400 font-bold uppercase tracking-widest mb-3">Elektronisk Knappsats</p>
                          <div className="bg-[#0284c7]/10 border-2 border-[#0284c7] p-3 rounded-xl mb-6 font-mono text-3xl tracking-[0.3em] text-[#38bdf8] flex justify-center items-center h-16 shadow-inner">
                            {keypadInput.padEnd(room.doorCode.length, "-")}
                          </div>
                          <div className="grid grid-cols-3 gap-2.5 max-w-[240px] mx-auto mb-5 font-mono font-bold">
                            {["1","2","3","4","5","6","7","8","9","C","0","OK"].map(k => (
                              <button
                                key={k}
                                onClick={() => {
                                  if (k === "C") handleKeypadClear();
                                  else if (k === "OK") handleKeypadSubmit();
                                  else handleKeypadPress(k);
                                }}
                                className={`h-12 rounded-xl text-base transition-all shadow ${
                                  k === "OK" ? 'bg-emerald-500 hover:bg-emerald-400 text-slate-900 font-black' 
                                    : k === "C" ? 'bg-rose-600 hover:bg-rose-500 text-white' 
                                    : 'bg-[#15392d] hover:bg-[#1d4d3d] text-white border-b-4 border-[#0d221b] active:border-b-0 active:translate-y-1'
                                }`}
                              >
                                {k}
                              </button>
                            ))}
                          </div>
                        </div>
                      )}

                      {room.doorType === "tumbler" && (
                        <div>
                          <p className="text-xs text-slate-400 font-bold uppercase tracking-widest mb-4">Mässingshjul (Kombination)</p>
                          <div className="flex justify-center gap-3 mb-8">
                            {tumblerValues.map((val, idx) => (
                              <div key={idx} className="flex flex-col items-center">
                                <button onClick={() => cycleTumbler(idx)} className="w-14 h-20 bg-[#ca8a04] hover:bg-amber-400 text-slate-950 border-y-4 border-[#713f12] rounded-lg flex items-center justify-center font-mono font-black text-3xl shadow-inner transition-colors">
                                  {val}
                                </button>
                                <span className="text-[10px] text-slate-500 font-bold mt-2 uppercase">↻ Vrid</span>
                              </div>
                            ))}
                          </div>
                          <button onClick={checkTumbler} className="w-full py-4 bg-amber-400 hover:bg-amber-300 text-slate-900 font-black text-xs uppercase tracking-widest rounded-xl transition-all shadow-lg">
                            Testa kombinationen
                          </button>
                        </div>
                      )}

                      {errorMsg && <p className="text-[11px] text-rose-400 font-bold text-center mt-4 uppercase tracking-widest animate-shake">{errorMsg}</p>}
                    </div>
                  )}

                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<EscapeRoomApp />);
  </script>
</body>
</html>
